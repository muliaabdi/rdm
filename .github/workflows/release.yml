name: Release Prebuilt Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binaries (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release asset
        run: |
          DIST_DIR="dist/rdm-linux-${{ matrix.arch }}"
          mkdir -p "$DIST_DIR/icons"

          cp "target/${{ matrix.target }}/release/rdm" "$DIST_DIR/"
          cp "target/${{ matrix.target }}/release/rdm-daemon" "$DIST_DIR/"
          cp "target/${{ matrix.target }}/release/rdm-ui" "$DIST_DIR/"
          cp "target/${{ matrix.target }}/release/rdm-host" "$DIST_DIR/"

          cp crates/rdm-ui/icons/128x128.png "$DIST_DIR/icons/"
          cp crates/rdm-ui/icons/128x128@2x.png "$DIST_DIR/icons/"

          tar -czf "rdm-linux-${{ matrix.arch }}.tar.gz" -C "$DIST_DIR" .
          sha256sum "rdm-linux-${{ matrix.arch }}.tar.gz" > "rdm-linux-${{ matrix.arch }}.tar.gz.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rdm-linux-${{ matrix.arch }}.tar.gz
            rdm-linux-${{ matrix.arch }}.tar.gz.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
