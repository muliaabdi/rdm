<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>RDM</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f4f0; --chrome: #f7f6f2; --chrome-hi: #fdfcfa; --chrome-lo: #eeede7;
    --line: #e4e2d9; --line2: #d6d3c7;
    --txt: #23262b; --dim: #6a6f76;
    --accent: #2f6fb8; --sel: #316ac5; --sel-bg: #e3eefd; --sel-edge: #27509e;
    --green: #2e8b30; --green-hi: #57b85c;
    --amber: #96520a; --red: #c0392b; --fill-fail: #d9534f; --fill-pause: #d99a2b;
    --track: #eceeec;
  }
  * { box-sizing: border-box; user-select: none; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 12px/1.45 system-ui, "Segoe UI", Ubuntu, "Noto Sans", "DejaVu Sans", sans-serif;
    color: var(--txt);
    background: var(--bg);
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  input, select { user-select: text; }
  button { font: inherit; }

  /* ---- toolbar ---- */
  #toolbar {
    display: flex; align-items: stretch; gap: 2px; padding: 6px 8px 5px;
    background: var(--chrome);
    border-bottom: 1px solid var(--line);
  }
  .tbtn {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    min-width: 62px; padding: 6px 10px 5px;
    border: none; border-radius: 9px;
    background: transparent; color: var(--txt); cursor: default;
    transition: background-color .13s ease;
  }
  .tbtn:hover { background: var(--chrome-lo); }
  .tbtn:hover svg { transform: translateY(-1px); }
  .tbtn:active { background: #e5e3da; }
  .tbtn:active svg { transform: translateY(0); }
  .tbtn[disabled] { opacity: .35; pointer-events: none; }
  .tbtn:focus-visible { outline: 2px solid #8fb1e6; outline-offset: -3px; }
  .tbtn svg { width: 20px; height: 20px; transition: transform .13s ease; }
  .tbtn span { font-size: 11px; color: #4a4e54; }
  .tsep { width: 1px; margin: 8px 5px; flex: none; background: var(--line2); opacity: .7; }
  #spacer { flex: 1; }

  /* ---- main split ---- */
  #main { flex: 1; display: flex; min-height: 0; background: #fff; }

  /* ---- categories ---- */
  #cats {
    width: 162px; flex: none; background: var(--chrome);
    border-right: 1px solid var(--line);
    padding: 9px 0; overflow-y: auto;
  }
  #cats h3 {
    margin: 0 8px 6px; padding: 0 6px 7px; font-size: 10.5px; font-weight: 650; letter-spacing: .07em;
    text-transform: uppercase; color: var(--dim);
    border-bottom: 1px solid var(--line);
  }
  .cat {
    display: flex; align-items: center; gap: 9px; margin: 2px 8px; padding: 5px 10px;
    border-radius: 8px; cursor: default;
    transition: background-color .12s ease;
  }
  .cat:hover { background: var(--chrome-lo); }
  .cat.sel { background: #e7eefb; color: #1d4d8f; }
  .cat .ic { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .cat .cnt { margin-left: auto; font-size: 10.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .cat.sel .cnt { color: #4d6f9f; }

  /* ---- table ---- */
  #listwrap { flex: 1; min-width: 0; background: #fff; display: flex; flex-direction: column; }
  #head, .row {
    display: grid;
    grid-template-columns: minmax(130px, 1fr) 76px 120px 82px 70px 76px;
    padding-right: 0;
  }
  #head {
    background: #fbfaf8;
    border-bottom: 1px solid var(--line);
    font-weight: 600; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim);
  }
  #head div { padding: 7px 6px; }
  #rows { flex: 1; overflow-y: auto; }
  .row {
    height: 30px; align-items: center; cursor: default;
    border-bottom: 1px solid #f5f4ef;
    transition: background-color .1s ease;
  }
  .row:hover { background: #f3f6fa; }
  .row.sel { background: var(--sel-bg); box-shadow: inset 3px 0 0 var(--accent); }
  .row:focus-visible { outline: 2px solid #8fb1e6; outline-offset: -2px; }
  .row.sel .dim { color: #5c6470; }
  .row .name {
    display: flex; align-items: center; gap: 8px; padding: 0 8px;
    overflow: hidden; white-space: nowrap;
  }
  .row .name .nm { overflow: hidden; text-overflow: ellipsis; }
  .fico { width: 15px; height: 15px; flex: none; border-radius: 4px; display: flex;
    align-items: center; justify-content: center; font: bold 8px/1 sans-serif; color: #fff; }
  .row > div { padding: 0 6px; overflow: hidden; white-space: nowrap; }
  .num, .st, .dim { text-align: right; font-variant-numeric: tabular-nums; }
  .st.running { color: var(--green); }
  .st.confirming, .st.resolving { color: var(--dim); }
  .st.paused { color: var(--amber); }
  .st.failed { color: var(--red); }
  .st.completed { color: #0a5d0e; }

  .row > .pcol { padding: 0 8px; }
  .cellbar {
    position: relative; height: 10px; border-radius: 999px; overflow: hidden;
    background: #eaeceb;
  }
  .cellbar > .fill {
    position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px;
    transition: width .5s linear, background-color .2s;
  }

  /* ---- details dialog ---- */
  #dlg.wide { width: 560px; }
  .dt-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; min-width: 0; }
  .dt-head .dt-name { font-weight: 650; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; user-select: text; }
  .dt-head .dt-st { margin-left: auto; flex: none; font-size: 11px; }
  /* percent sits inside the bar so the bar keeps the full dialog width */
  .bigbar { position: relative; height: 16px; margin-bottom: 10px; overflow: hidden;
    background: var(--track); border-radius: 999px; }
  .bigbar > .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px;
    transition: width .45s linear, background-color .2s; }
  .errline { display: none; margin: 0 0 10px; color: var(--red); font-size: 11px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; user-select: text; }
  .errline.on { display: block; }
  .dgrid { display: grid; grid-template-columns: 96px 1fr 96px 1fr; gap: 4px 10px; font-size: 11px; margin-bottom: 14px; }
  .dgrid .k { color: var(--dim); }
  .dgrid .v { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; user-select: text; }
  .dt-gtitle { font-size: 10px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
  .dgraph { width: 100%; height: 96px; display: block; border: 1px solid var(--line); border-radius: 8px; background: #fff; }

  /* ---- status bar ---- */
  #status {
    height: 24px; flex: none; display: flex; align-items: center; gap: 20px; padding: 0 12px;
    background: var(--chrome); border-top: 1px solid var(--line);
    font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums;
  }
  #s-conn { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  #s-conn .dot { width: 7px; height: 7px; border-radius: 50%; background: #c9a520; }
  #s-conn.ok .dot { background: #2e8b30; }
  #s-conn.bad .dot { background: #c0392b; }

  /* ---- modal ---- */
  #modal {
    position: fixed; inset: 0; background: rgba(30,28,22,.30);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden; transition: opacity .14s ease, visibility .14s;
  }
  #modal.open { opacity: 1; visibility: visible; }
  #dlg {
    width: 400px; max-width: calc(100vw - 32px);
    background: #fbfaf7; border: 1px solid var(--line2); border-radius: 12px;
    box-shadow: 0 14px 44px rgba(24,22,14,.22);
    padding: 16px 18px; transform: translateY(8px) scale(.98); transition: transform .14s ease;
  }
  #modal.open #dlg { transform: none; }
  #dlg h3 { margin: 0 0 12px; font-size: 13px; }
  #dlg input, #dlg select {
    width: 100%; padding: 7px 10px; margin-bottom: 11px;
    border: 1px solid var(--line2); border-radius: 8px; font: inherit; background: #fff;
    transition: border-color .12s ease;
  }
  #dlg input:hover, #dlg select:hover { border-color: #c3c0b2; }
  #dlg input:focus-visible, #dlg select:focus-visible { outline: 2px solid #8fb1e6; outline-offset: -1px; border-color: #8fb1e6; }
  #dlg .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  #dlg button {
    padding: 6px 18px; border: 1px solid var(--line2); border-radius: 8px; cursor: default;
    background: #fff; color: var(--txt);
    transition: background-color .12s ease, border-color .12s ease;
  }
  #dlg button:hover { background: #f4f2ea; border-color: #c3c0b2; }
  #dlg button:active { background: #eae7dc; }
  #dlg button:focus-visible { outline: 2px solid #8fb1e6; outline-offset: 1px; }
  #dlg button.pri { border-color: transparent; color: #fff; background: #3569b8; }
  #dlg button.pri:hover { background: #3d74c6; }
  #dlg button.pri:active { background: #2e5da3; }
  .mhint { font-size: 11px; color: var(--dim); margin: -4px 0 11px; min-height: 14px; }
  .empty {
    grid-column: 1 / -1; padding: 48px 20px; text-align: center; color: #8b8e93;
  }
  .empty svg { width: 36px; height: 36px; margin-bottom: 10px; opacity: .4; }
  .empty .empty-hint { margin-top: 5px; font-size: 11px; color: #9a9da1; }

  /* ---- context menu ---- */
  #ctx {
    position: fixed; z-index: 60; min-width: 178px; display: none; padding: 5px;
    background: #fdfcfa; border: 1px solid var(--line2); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(24,22,14,.20);
  }
  #ctx.open { display: block; }
  #ctx button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 6px 12px 6px 10px; border: none; border-radius: 7px;
    background: transparent; font: inherit; color: var(--txt); text-align: left; cursor: default;
    transition: background-color .1s ease;
  }
  #ctx button:hover { background: #e9effb; }
  #ctx button:focus-visible { outline: 2px solid #8fb1e6; outline-offset: -2px; }
  #ctx button:disabled { opacity: .35; pointer-events: none; }
  #ctx button svg { width: 14px; height: 14px; flex: none; }
  #ctx .sep { height: 1px; margin: 4px 9px; background: var(--line); }

  /* ---- toast ---- */
  #toast {
    position: fixed; left: 50%; bottom: 36px; z-index: 90;
    transform: translateX(-50%) translateY(6px);
    background: #2b2f36; color: #f2f3f5;
    padding: 8px 16px; border-radius: 9px; font-size: 12px;
    max-width: 70vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    box-shadow: 0 8px 24px rgba(0,0,0,.28);
    opacity: 0; pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
  }
  #toast.on { opacity: 1; transform: translateX(-50%); }
  #dlg .fld { display: flex; gap: 8px; align-items: center; margin-bottom: 11px; }
  #dlg .fld label { width: 96px; color: #4a4e54; }
  #dlg .fld input, #dlg .fld select { flex: 1; margin: 0; min-width: 0; }
  #dlg .fld input.narrow { flex: 0 0 108px; }
  #dlg .fld input.chk { flex: 0 0 auto; width: 16px; height: 16px; accent-color: #2b6cff; }
  #dlg .ftypes { flex: 1; display: flex; flex-wrap: wrap; gap: 7px 4px; }
  #dlg .ftypes .fchk { display: inline-flex; align-items: center; gap: 6px; width: auto; min-width: 96px; font-weight: 400; color: #3c4046; cursor: pointer; }
  #dlg .ftypes .fchk input { flex: 0 0 auto; width: 14px; height: 14px; accent-color: #2b6cff; margin: 0; }
  #dlg .ftypes.all .fchk:nth-child(n+2) { opacity: .4; }

  /* ---- scrollbars ---- */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d8d5ca; border: 2px solid #fff; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: #c3c0b2; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div id="toolbar" role="toolbar" aria-label="RDM">
  <button type="button" class="tbtn" id="b-add" data-i18n-title="add_url">

    <span data-i18n="settings">Settings</span>

</div>

<div id="main">

</div>

<div id="modal"><div id="dlg"></div></div>
<div id="ctx" role="menu"></div>

<script>
const $ = (id) => document.getElementById(id);
const diag = (m) => window.__TAURI__?.core?.invoke("diag", { msg: m }).catch(() => {});
window.addEventListener("error", (e) => diag("onerror: " + e.message));
let invoke = async () => { throw new Error("IPC not ready"); };
let listen = async () => () => {};
try {
  invoke = window.__TAURI__.core.invoke;
  listen = window.__TAURI__.event.listen;
  diag("boot ok");
} catch (e) { diag("ipc fail " + e.message); }

async function focusWindow() {
  try {
    const w = window.__TAURI__.window.getCurrentWindow();
    await w.show();
    await w.unminimize();
    // Wayland: a plain setFocus from a background app is often ignored;
    // pin briefly on top so the compositor raises the window, then unpin
    await w.setAlwaysOnTop(true);
    await w.setFocus();
    setTimeout(() => { w.setAlwaysOnTop(false).catch(() => {}); }, 400);
  } catch (e) { diag("focus: " + (e.message || e)); }
}

/* ---------- helpers ---------- */
function fmt(n) {
  if (n == null) return "?";
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : 1)) + " " + u[i];
}
function fmtSpeed(bps) {

  return fmt(bps) + "/s";
}
function fmtEta(sec) {
  if (sec == null || !isFinite(sec) || sec < 0) return "∞";
  if (sec < 60) return Math.ceil(sec) + t("u_s");
  if (sec < 3600) return Math.floor(sec / 60) + t("u_m") + " " + Math.ceil(sec % 60) + t("u_s");
  return Math.floor(sec / 3600) + t("u_h") + " " + Math.ceil((sec % 3600) / 60) + t("u_m");
}
function esc(s) {

function segGradient(segs, size) {

  if (!segs || !size) return "linear-gradient(90deg,#57b85c 0%,#57b85c 0%)";
  const full = "#57b85c", alt = "#3f9d46";
  const parts = [];
  segs.forEach((s, i) => {
    const a = (s.start / size) * 100, b = (s.done / Math.max(1, s.end - s.start + 1)) * 100;
    const c = i % 2 ? alt : full;
    if (b > 0) parts.push(`${c} ${a.toFixed(2)}%`, `${c} ${(a + ((b / 100) * ((s.end - s.start + 1) / size) * 100)).toFixed(2)}%`);

}

  const ch = { compressed: "Z", documents: "D", music: "♪", video: "▶", programs: "P", other: "?" }[k];
  return `<span class="fico" style="background:${col}">${ch}</span>`;
}

/* ---------- speed sampling ---------- */
function sampleSpeed(id, done) {
  const now = performance.now();
  let h = speeds.get(id);
  if (!h) { h = []; speeds.set(id, h); }
  h.push({ t: now, done });
  while (h.length > 2 && now - h[0].t > 6000) h.shift();
  if (h.length < 2) return 0;
  const a = h[0], b = h[h.length - 1];
  const dt = (b.t - a.t) / 1000;
  if (dt < 0.3) return 0;
  return Math.max(0, (b.done - a.done) / dt);
}

  $("dt-file").title = j.out_path || "";
  $("dt-cat").textContent = t(CATS.find(([id]) => id === catOf(j))[1]);
  $("dt-size").textContent = j.size ? fmt(j.size) : "?";
  $("dt-done").textContent = fmt(j.done);
  $("dt-speed").textContent = j.status === "running" ? fmtSpeed(j.speed) : "—";
  $("dt-eta").textContent = j.status === "running" ? fmtEta(etaOf(j)) : "—";
  const tog = $("dt-toggle");
  if (tog) {
    const idle = j.status === "completed" || j.status === "resolving";
    tog.hidden = idle; // nothing to pause/resume once finished or still resolving
    if (!idle) tog.textContent = j.status === "running" ? t("stop") : t("resume");
  }
  paintGraph($("dt-graph"), detailSeries());
}
function renderStatus() {
  const running = [...jobs.values()].filter((j) => j.status === "running");
  const tot = running.reduce((a, j) => a + (j.speed || 0), 0);
  $("s-items").textContent = t("items_fmt", { n: jobs.size, m: running.length });
  $("s-speed").textContent = t("total_fmt", { s: fmtSpeed(tot) });
}

/* ---------- graph ---------- */
/// Distinct hue per segment index; 47 is coprime to 360 so up to ~30 bands
/// stay visually apart. Segment indices are stable across dynamic splits.
function segColor(i, a) {
  return `hsla(${(i * 47 + 8) % 360},60%,50%,${a})`;
}
function paintGraph(cv, samples) {
  if (!cv || !cv.getContext) return;
  const ctx = cv.getContext("2d");
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(40, Math.round(r.width * dpr));
  const h = Math.max(24, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  ctx.clearRect(0, 0, w, h);
  const vals = samples.map((s) => s.v);
  const max = Math.max(1024, ...vals) * 1.15;
  ctx.strokeStyle = "#e7e4d6";
  ctx.lineWidth = 1;
  const step = 34 * dpr;
  for (let x = step; x < w; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = step; y < h; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  ctx.strokeStyle = "#d5d2c2";
  ctx.beginPath(); ctx.moveTo(0, h - 1); ctx.lineTo(w, h - 1); ctx.stroke();
  const peak = Math.max(0, ...vals);
  if (peak >= 1 && samples.length > 1) {
    const n = samples.length;
    const x = (i) => (i / (n - 1)) * w;
    const y = (v) => h - (v / max) * (h - 4 * dpr) - 2 * dpr;
    const maxSeg = samples.reduce((m, s) => Math.max(m, s.seg ? s.seg.length : 0), 0);
    if (maxSeg > 1) {
      // stacked bands: one colored area per segment, total = outline on top
      const cums = samples.map((sm) => {
        const a = [0];
        (sm.seg || []).forEach((v) => a.push(a[a.length - 1] + v));
        return a;
      });
      for (let s = 0; s < maxSeg; s++) {
        ctx.beginPath();
        for (let i = 0; i < n; i++) { const yy = y(cums[i][s + 1] || 0); i ? ctx.lineTo(x(i), yy) : ctx.moveTo(x(i), yy); }
        for (let i = n - 1; i >= 0; i--) ctx.lineTo(x(i), y(cums[i][s] || 0));
        ctx.closePath();
        ctx.fillStyle = segColor(s, 0.6);
        ctx.fill();
      }
      ctx.beginPath();
      samples.forEach((sm, i) => { const yy = y(sm.v); i ? ctx.lineTo(x(i), yy) : ctx.moveTo(x(i), yy); });
      ctx.strokeStyle = "#2e8b30"; ctx.lineWidth = 1.5 * dpr;
      ctx.lineJoin = "round";
      ctx.stroke();
      ctx.fillStyle = "#7a7a7a";
      ctx.font = `${10 * dpr}px system-ui, sans-serif`;
      ctx.fillText(fmt(max) + "/s", 4 * dpr, 10 * dpr);
      const lbl = `${maxSeg} seg`;
      ctx.fillText(lbl, w - ctx.measureText(lbl).width - 4 * dpr, 10 * dpr);
    } else {
      ctx.beginPath();
      vals.forEach((v, i) => {
        const yy = y(v);
        i ? ctx.lineTo(x(i), yy) : ctx.moveTo(x(i), yy);
      });
      ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
      ctx.fillStyle = "rgba(87,184,92,.30)";
      ctx.fill();
      ctx.strokeStyle = "#2e8b30"; ctx.lineWidth = 1.5 * dpr;
      ctx.lineJoin = "round";
      ctx.stroke();
      ctx.fillStyle = "#7a7a7a";
      ctx.font = `${10 * dpr}px system-ui, sans-serif`;
      ctx.fillText(fmt(max) + "/s", 4 * dpr, 10 * dpr);
    }
  } else {
    ctx.fillStyle = "#7a7a7a";
    ctx.font = `${10 * dpr}px system-ui, sans-serif`;
    ctx.fillText(fmt(max) + "/s", 4 * dpr, 10 * dpr);
  }
}

/* ---------- events from daemon ---------- */
function apply(v) {
  const j = jobs.get(v.id) || { id: v.id, filename: "?", done: 0, size: null, status: "running", speed: 0 };
  let rebuild = false;
  for (const k of ["filename", "out_path", "size", "done", "status", "error"]) {
    if (v[k] != null && j[k] !== v[k]) { j[k] = v[k]; if (k === "status") rebuild = true; }
  }
  if (v.segments) j.segs = v.segments;
  j.speed = j.status === "running" ? sampleSpeed(v.id, j.done) : (speeds.delete(v.id), 0);
  jobs.set(v.id, j);
  renderCats(); renderRows();
}
let connState = "wait";
function setConn(state) {
  connState = state;
  const el = $("s-conn");
  el.className = state;
  $("s-conn-t").textContent =
    t(state === "ok" ? "connected" : state === "bad" ? "disconnected" : "connecting");
}
listen("rdm", (ev) => {
  const m = ev.payload;
  switch (m.t) {
    case "disconnected": connected = false; setConn("bad"); break;
    case "jobs":
      if (!connected) { connected = true; diag("jobs n=" + (m.jobs || []).length); setConn("ok"); }
      const seen = new Set((m.jobs || []).map((x) => x.id));
      for (const id of [...jobs.keys()]) if (!seen.has(id)) { jobs.delete(id); speeds.delete(id); segPrev.delete(id); jobHist.delete(id); }
      for (const j of m.jobs || []) apply(j);
      // opened late (e.g. auto-launched by a browser offer): highlight the newest running job
      if (selected == null || !jobs.has(selected)) {
        const r = [...jobs.values()].filter((j) => j.status === "running").sort((a, b) => b.id - a.id)[0];
        if (r) { selected = r.id; renderRows(); }
      }
      break;
    case "accepted": apply({ id: m.id, status: "running", done: 0 }); selected = m.id; renderRows(); break;
    case "confirm":
      apply({ id: m.id, filename: m.filename, out_path: m.out_path, status: "confirming", done: 0 });
      selected = m.id;
      renderRows();
      openConfirm(m);
      break;
    case "show": focusWindow(); break;
    case "formats": if (window.__onFormats) window.__onFormats(m); break;
    case "error": if (window.__onFormats) { const f = window.__onFormats; window.__onFormats = null; f({ __err: m.error }); } else diag("daemon error: " + m.error); break;
    case "started": apply({ id: m.id, size: m.size }); break;
    case "status": apply({ id: m.id, status: m.status }); renderRows(); break;
    case "progress": apply({ id: m.id, done: m.done, size: m.size, status: "running" }); break;
    case "detail":
      if (!detailSeen) { detailSeen = true; diag("detail segments received"); }
      apply({ id: m.id, segments: m.segments, status: "running" });
      break;
    case "done": apply({ id: m.id, done: m.size, size: m.size, status: "completed" }); break;
    case "failed": apply({ id: m.id, status: "failed", error: m.error }); break;
    case "paused": apply({ id: m.id, status: "paused" }); break;
    case "cancelled": apply({ id: m.id, status: "cancelled" }); break;
    case "deleted": jobs.delete(m.id); speeds.delete(m.id); segPrev.delete(m.id); jobHist.delete(m.id); if (selected === m.id) selected = null;
      renderCats(); renderRows(); break;
  }
});

setInterval(() => {
  const now = performance.now();
  for (const j of jobs.values()) {
    if (j.status === "running") {
      j.speed = sampleSpeed(j.id, j.done);
      let h = jobHist.get(j.id);
      if (!h) { h = []; jobHist.set(j.id, h); }
      // per-segment speed from consecutive detail snapshots (~400 ms cadence)
      let seg = null;
      if (j.segs && j.segs.length) {
        const cur = j.segs.map((s) => s.done);
        const p = segPrev.get(j.id);
        const dt = p ? (now - p.t) / 1000 : 0;
        if (p && dt >= 0.2) {
          seg = cur.map((d, i) => Math.max(0, (d - (p.arr[i] ?? 0)) / dt));
        }
        segPrev.set(j.id, { t: now, arr: cur });
      }
      h.push({ v: seg ? seg.reduce((a, b) => a + b, 0) : (j.speed || 0), seg });
      if (h.length > 120) h.shift();
    } else if (segPrev.has(j.id)) {
      segPrev.delete(j.id);
    }
  }
  renderRows();
}, 500);

/* ---------- dialogs ---------- */
let lastFocus = null;
function openModal(html) {
  lastFocus = document.activeElement;
  $("dlg").classList.remove("wide");
  $("dlg").innerHTML = html;
  $("modal").classList.add("open");
  const f = $("dlg").querySelector("input, select, button:not(.pri)");
  if (f) setTimeout(() => f.focus(), 60);
}
function closeModal() {
  $("modal").classList.remove("open");
  detailsFor = null;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
  lastFocus = null;
}
$("modal").onclick = (e) => { if (e.target.id === "modal") closeModal(); };
window.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if ($("ctx").classList.contains("open")) { closeCtx(); return; }
  if ($("modal").classList.contains("open")) closeModal();
});

const YT_HOSTS = /(^|\.)(youtube\.com|youtu\.be|vimeo\.com|dailymotion\.com|twitch\.tv|instagram\.com|tiktok\.com|twitter\.com|x\.com|facebook\.com|fb\.watch|reddit\.com|soundcloud\.com|bilibili\.com|nicovideo\.jp|rumble\.com|odysee\.com)$/i;
function isPageUrl(u) {
  try {
    const x = new URL(u);
    if (YT_HOSTS.test(x.hostname)) return true;
    return !/\.[a-z0-9]{2,5}$/i.test(x.pathname);
  } catch { return false; }
}

$("b-add").onclick = () => {
  openModal(`<h3>${t("dlg_add_title")}</h3>
    <input id="m-url" placeholder="${esc(t("ph_url"))}" autofocus spellcheck="false" autocomplete="off" autocapitalize="off" />
    <div id="m-hint" class="mhint"></div>
    <div id="m-quality"></div>
    <div class="btns">
      <button id="m-detect">${t("btn_detect")}</button>
      <button id="m-cancel">${t("btn_cancel")}</button>
      <button id="m-ok" class="pri">${t("btn_download")}</button>
    </div>`);
  $("m-cancel").onclick = closeModal;
  const hint = (txt) => { $("m-hint").textContent = txt || ""; };
  hint(isPageUrl($("m-url").value) ? t("hint_page") : "");

  const renderQuality = (m) => {
    const fmts = (m.formats || []).filter((f) => f.vcodec !== "none" && f.height);
    const heights = [...new Set(fmts.map((f) => f.height))].sort((a, b) => b - a);
    const opts = heights.map((h) => {
      const f = fmts.find((x) => x.height === h);
      const sz = f && f.filesize ? " — " + fmt(f.filesize) : "";
      return `<option value="${h}">${h}p${sz}</option>`;
    }).join("");
    const hasAudio = (m.formats || []).some((f) => f.acodec !== "none");
    openModal(`<h3>${t("dlg_quality_title")}</h3>
      <div class="mhint">${esc(m.title || m.url || "")}</div>
      <select id="m-q">${opts}${hasAudio ? `<option value="audio">${t("opt_audio")}</option>` : ""}</select>
      <div class="btns"><button id="m-qcancel">${t("btn_cancel")}</button><button id="m-qok" class="pri">${t("btn_download")}</button></div>`);
    $("m-qcancel").onclick = closeModal;
    $("m-qok").onclick = async () => {
      const val = $("m-q").value;
      const audio = val === "audio";
      const h = audio ? 0 : Number(val) || 1080;
      try { await invoke("add_page", { url: m.url, height: h, audioOnly: audio }); }
      catch (e) { toast(trErr(e)); }
      closeModal();
    };
  };

  const detect = async () => {
    const url = $("m-url").value.trim();
    if (!url) return;
    hint(t("hint_detecting"));
    window.__onFormats = (m) => {
      window.__onFormats = null;
      if (!m || m.__err) { hint(t("hint_fail", { e: (m && m.__err) || "?" })); return; }
      renderQuality(m);
    };
    try { await invoke("probe_url", { url }); } catch (e) { hint(t("hint_fail", { e: e })); }
  };
  $("m-detect").onclick = detect;

  const go = async () => {
    const url = $("m-url").value.trim();
    if (!url) return;
    if (isPageUrl(url) && !$("m-quality").innerHTML) { return detect(); }
    try { await invoke("add_url", { url }); } catch (e) { toast(trErr(e)); }
    closeModal();
  };
  $("m-ok").onclick = go;
  $("m-url").addEventListener("keydown", (e) => e.key === "Enter" && go());
  setTimeout(() => $("m-url").focus(), 50);
};

$("b-resume").onclick = () => selected && invoke("job_action", { action: "resume", id: selected }).catch((e) => toast(trErr(e)));
$("b-stop").onclick = () => selected && invoke("job_action", { action: "pause", id: selected }).catch((e) => toast(trErr(e)));
$("b-delete").onclick = () => selected && invoke("job_action", { action: "delete", id: selected }).catch((e) => toast(trErr(e)));
$("b-restart").onclick = () => selected && invoke("job_action", { action: "restart", id: selected }).catch((e) => toast(trErr(e)));
// Details opens by double-click, Enter or the row context menu
$("rows").addEventListener("keydown", (e) => e.key === "Enter" && document.activeElement.classList.contains("row") && openDetails(+document.activeElement.dataset.id));

/* ---------- file-type groups for the intercept filter ---------- */
const FTYPES = [
  ["images", "ft_images", "jpg jpeg png gif webp bmp svg ico tiff avif heic"],
  ["videos", "ft_videos", "mp4 mkv avi mov webm flv wmv m4v mpg mpeg ts 3gp"],
  ["audio", "ft_audio", "mp3 wav flac aac ogg opus m4a wma mid"],
  ["docs", "ft_docs", "pdf doc docx xls xlsx ppt pptx txt rtf odt ods odp csv epub mobi"],
  ["apps", "ft_apps", "exe msi apk deb rpm appimage flatpak snap dmg pkg jar"],
  ["arch", "ft_arch", "zip rar 7z tar gz bz2 xz zst lz lzma cab iso img"],
  ["others", "ft_others", "torrent bin dat m3u8 mpd nfo srt"],
];
const EXT2CAT = new Map(FTYPES.flatMap(([id, , str]) => str.split(" ").map((x) => [x, id])));

$("b-options").onclick = async () => {
  const s = await invoke("get_settings");
  const auto = await invoke("get_autostart").catch(() => !!s.autostart);
  const list = s.intercept_ext || [];
  const allOn = list.length === 0;
  const extras = list.filter((x) => !EXT2CAT.has(x)).join(", ");
  openModal(`<h3>${t("dlg_settings_title")}</h3>
    <div class="fld"><label>${t("fld_dir")}</label><input id="o-dir" value="${esc(s.dir || "")}" placeholder="${esc(t("ph_dir"))}"></div>
    <div class="fld"><label>${t("fld_segments")}</label><input id="o-seg" class="narrow" type="number" min="1" max="32" value="${s.segments || 8}"></div>
    <div class="fld"><label>${t("fld_ftype")}</label>
      <div class="ftypes${allOn ? " all" : ""}" id="ft-box">
        <label class="fchk"><input type="checkbox" id="ft-all"${allOn ? " checked" : ""}><span>${t("ft_all")}</span></label>
        ${FTYPES.map(([id, key, str]) => `<label class="fchk"><input type="checkbox" id="ft-${id}"${str.split(" ").every((x) => list.includes(x)) ? " checked" : ""}${allOn ? " disabled" : ""}><span>${t(key)}</span></label>`).join("")}
      </div></div>
    <div class="fld"><label>${t("fld_extra")}</label><input id="o-int" placeholder="${esc(t("ph_intercept"))}" value="${esc(extras)}" spellcheck="false" autocomplete="off"></div>
    <div class="fld"><label>${t("fld_lang")}</label><select id="o-lang">
      <option value="en"${lang === "en" ? " selected" : ""}>English</option>
      <option value="id"${lang === "id" ? " selected" : ""}>Indonesia</option></select></div>
    <div class="fld"><label>${t("fld_autostart")}</label><input id="o-auto" class="chk" type="checkbox"${auto ? " checked" : ""}></div>
    <div class="btns"><button id="o-cancel">${t("btn_cancel")}</button><button id="o-ok" class="pri">${t("btn_save")}</button></div>`);
  $("o-cancel").onclick = closeModal;
  $("ft-all").onchange = () => {
    const on = $("ft-all").checked;
    $("ft-box").classList.toggle("all", on);
    for (const [id] of FTYPES) $("ft-" + id).disabled = on;
  };
  $("o-ok").onclick = async () => {
    const next = $("o-lang").value;
    let ints = [];
    if (!$("ft-all").checked)
      for (const [id, , str] of FTYPES) if ($("ft-" + id).checked) ints.push(...str.split(" "));
    ints.push(...(($("o-int").value || "")
      .split(/[,;\s]+/)
      .map((x) => x.replace(/^\./, "").toLowerCase())
      .filter((x) => /^[a-z0-9]{1,8}$/.test(x))));
    ints = [...new Set(ints)];
    if (!$("ft-all").checked && ints.length === 0) toast(t("ft_empty_all"));
    const auto = $("o-auto").checked;
    await invoke("set_settings", {
      v: { dir: $("o-dir").value.trim() || null, segments: Number($("o-seg").value) || 8, lang: next, intercept_ext: ints, autostart: auto },
    });
    await invoke("set_autostart", { enabled: auto }).catch((e) => toast(trErr(e)));
    closeModal();
    if (next !== lang) setLang(next);
  };
};

(async () => {
  try {
    const s = await invoke("get_settings");
    if (s && s.lang === "id") lang = "id";
    // keep the autostart entry pointing at this build
    if (s && s.autostart) invoke("set_autostart", { enabled: true }).catch(() => {});
  } catch (e) { diag("lang load: " + e); }
  applyI18n();
})();

invoke("list_jobs").catch(() => {});
setInterval(() => invoke("list_jobs").catch(() => {}), 5000);
</script>
