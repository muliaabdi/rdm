<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Rust Download Manager</title>
<style>
  /* Design system: clean minimal flat.
     Cool neutrals + one blue accent; green/amber/red/blue are status semantics
     only. No gradients except the segmented progress fill (it encodes
     per-segment completion) and the speed graph (data viz). Radius: 5-6px
     controls, 8-10px overlays. Shadow only on overlays. */
  :root {
    color-scheme: light;
    --bg: #f3f4f6; --surface: #ffffff; --surface-2: #fafbfc; --hover: #f1f3f6;
    --line: #e4e6ea; --line-2: #d3d7dd; --sep: #c9ced8;
    --ctl: #8a93a0; --ctl-hov: #6f7885;
    --txt: #1a1d21; --txt-2: #444a53; --dim: #5d6470; --dim-2: #6d7480;
    --accent: #2b62c4; --accent-btn: #2b62c4; --accent-hi: #3870d2; --accent-act: #23509f;
    --sel-bg: #eaf1fc; --focus: #2b62c4;
    --ok: #177c31; --amber: #94620a; --red: #bd3325; --info: #3a67b8;
    --fill-ok: #268a3c; --fill-red: #d9534f; --fill-amber: #d99a2b;
    --track: #e8eaee;
    --input-bg: #ffffff; --menu-bg: #ffffff; --menu-hov: #f1f3f6;
    --btn-bg: #ffffff; --btn-hi: #f3f5f8; --btn-act: #e9ecf1;
    --tool-hov: #e9ebee; --tool-act: #dfe3e9;
    --toast-bg: #26292f; --toast-txt: #f2f3f5;
    --sb: #c9cdd4; --sb-hi: #a8afb9; --edge: #ffffff;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #17181c; --surface: #1f2126; --surface-2: #23262c; --hover: #272b32;
    --line: #2d313a; --line-2: #3c414d; --sep: #40454f;
    --ctl: #6b7484; --ctl-hov: #8a93a4;
    --txt: #e7e9ec; --txt-2: #c5cad2; --dim: #9aa2ad; --dim-2: #8a92a0;
    --accent: #7db0f7; --accent-btn: #3d6fd6; --accent-hi: #4c7ede; --accent-act: #2f5cb0;
    --sel-bg: #26344a; --focus: #7db0f7;
    --ok: #62c875; --amber: #e0a63e; --red: #ef8071; --info: #8fb4f5;
    --fill-ok: #4fae60; --fill-red: #d9534f; --fill-amber: #d99a2b;
    --track: #2b2f37;
    --input-bg: #1a1c20; --menu-bg: #23262c; --menu-hov: #2a3040;
    --btn-bg: #262a31; --btn-hi: #2d323b; --btn-act: #343a45;
    --tool-hov: #2e333c; --tool-act: #363c47;
    --toast-bg: #26292f; --toast-txt: #f2f3f5;
    --sb: #3a404c; --sb-hi: #4c5361; --edge: #1f2126;
  }
  * { box-sizing: border-box; user-select: none; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 12.5px/1.45 system-ui, "Segoe UI", Ubuntu, "Noto Sans", "DejaVu Sans", sans-serif;
    color: var(--txt);
    background: var(--bg);
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  input, select { user-select: text; }
  button { font: inherit; }

  /* ---- top bar: window title + actions in one row ---- */
  #titlebar {
    display: flex; align-items: center; gap: 3px; height: 46px;
    padding: 0 8px 0 12px; flex: none;
    background: var(--bg); border-bottom: 1px solid var(--line);
  }
  #titlebar .tb-title {
    font-size: 12px; font-weight: 650; color: var(--txt-2); margin: 0 9px 0 2px;
  }
  .tbtn {
    display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px;
    border: 1px solid transparent; border-radius: 6px;
    background: transparent; color: var(--txt-2); cursor: default; font-size: 12px;
    transition: background-color .12s ease, color .12s ease;
  }
  .tbtn:hover { background: var(--tool-hov); color: var(--txt); }
  .tbtn:active { background: var(--tool-act); }
  .tbtn[disabled] { opacity: .38; pointer-events: none; }
  .tbtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .tbtn svg { width: 15px; height: 15px; flex: none; color: var(--dim); transition: color .12s ease; }
  .tbtn:hover svg { color: var(--txt-2); }
  .tbtn.ico { padding: 0; width: 30px; justify-content: center; gap: 0; }
  /* narrow windows: drop button labels first, keep the actions icon-only */
  @media (max-width: 759px) {
    #titlebar { padding-left: 8px; }
    .tbtn > span { display: none; }
    #b-add { padding: 0; width: 30px; justify-content: center; }
  }
  /* the one filled control: the primary action owns the accent */
  #b-add { background: var(--accent-btn); color: #fff; padding: 0 12px; }
  #b-add:hover { background: var(--accent-hi); color: #fff; }
  #b-add:active { background: var(--accent-act); }
  #b-add svg, #b-add:hover svg { color: #fff; }
  .tsep { width: 1px; height: 18px; margin: 0 5px; flex: none; background: var(--sep); }
  #spacer { flex: 1; }
  .tb-btn {
    width: 34px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: 6px; background: transparent; color: var(--dim);
    transition: background-color .12s ease, color .12s ease;
  }
  .tb-btn:hover { background: var(--tool-hov); color: var(--txt); }
  .tb-btn:active { background: var(--tool-act); }
  .tb-btn.cls:hover { background: #d9534f; color: #fff; }
  .tb-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .tb-btn svg { width: 12px; height: 12px; }

  /* ---- main split ---- */
  #main { flex: 1; display: flex; min-height: 0; background: var(--surface); }

  /* ---- sidebar: categories + queues, plain text navigation ---- */
  #cats {
    width: 168px; flex: none; background: var(--bg);
    border-right: 1px solid var(--line);
    padding: 10px 8px; overflow-y: auto;
  }
  #cats h3 {
    margin: 14px 9px 6px; font-size: 11px; font-weight: 600; color: var(--dim);
  }
  #cats h3:first-child { margin-top: 4px; }
  .cat {
    display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 9px;
    border-radius: 6px; cursor: default; color: var(--txt-2); font-size: 12.5px;
    transition: background-color .12s ease, color .12s ease;
  }
  .cat:hover { background: var(--hover); color: var(--txt); }
  .cat.sel { background: var(--sel-bg); color: var(--accent); }
  .cat:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .cat .cnt { margin-left: auto; font-size: 11px; color: var(--dim);
    font-variant-numeric: tabular-nums; }
  #qlist .cat .run-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
  #qlist .cat.drop { background: var(--sel-bg); color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent); }
  /* scheduler position, shown only inside a queue view */
  .row .rank { width: 16px; flex: none; text-align: center; color: var(--dim-2);
    font-size: 10px; font-variant-numeric: tabular-nums; }
  /* queue header strip above the table when a queue is open */
  #qhead { display: flex; align-items: center; gap: 10px; height: 36px; flex: none;
    padding: 0 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 11.5px; }
  #qhead[hidden] { display: none; }
  #qhead .qname { font-weight: 650; font-size: 12.5px; }
  #qhead .qmeta { color: var(--dim); font-variant-numeric: tabular-nums; }
  #qhead .qgrow { flex: 1; }
  .qbtn { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px;
    border: 1px solid var(--ctl); border-radius: 5px; background: var(--btn-bg); color: var(--txt-2);
    font-size: 11px; cursor: default;
    transition: background-color .12s ease, border-color .12s ease, color .12s ease; }
  .qbtn:hover { background: var(--btn-hi); border-color: var(--ctl-hov); color: var(--txt); }
  .qbtn:active { background: var(--btn-act); }
  .qbtn[disabled] { opacity: .4; pointer-events: none; }
  .qbtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .qbtn svg { width: 11px; height: 11px; flex: none; }
  .qbtn.go svg { color: var(--ok); }
  /* queue picker: pick an existing label or type a new one */
  #dlg .qopts { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; }
  #dlg .qopt { display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 10px;
    border: 1px solid transparent; border-radius: 6px; background: transparent;
    font: inherit; color: var(--txt-2); text-align: left; cursor: default;
    transition: background-color .12s ease; }
  #dlg .qopt:hover { background: var(--hover); }
  #dlg .qopt .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #dlg .qopt .cnt { font-size: 11px; color: var(--dim-2); font-variant-numeric: tabular-nums; }
  #dlg .qopt .ck { width: 14px; height: 14px; flex: none; color: var(--accent); visibility: hidden; }
  #dlg .qopt.cur { background: var(--sel-bg); color: var(--accent); }
  #dlg .qopt.cur .cnt { color: var(--dim); }
  #dlg .qopt.cur .ck { visibility: visible; }
  #dlg .qopt:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  #dlg .qnew { display: flex; gap: 8px; margin-bottom: 10px; }
  #dlg .qnew input { flex: 1; min-width: 0; margin: 0; }
  #dlg .qnew button { flex: none; padding: 6px 14px; }

  /* ---- table ---- */
  #listwrap { flex: 1; min-width: 0; background: var(--surface); display: flex; flex-direction: column; }
  #head, .row {
    display: grid;
    grid-template-columns: minmax(150px, 1fr) 64px minmax(96px, 150px) 88px 64px 80px;
    align-items: center;
    padding: 0 12px;
  }
  #head {
    height: 30px; flex: none;
    background: var(--surface-2);
    border-bottom: 1px solid var(--line);
    font-weight: 600; font-size: 11px; color: var(--dim);
    white-space: nowrap;
  }
  #rows { flex: 1; overflow-y: auto; }
  .row {
    height: 42px; cursor: default;
    border-bottom: 1px solid var(--line);
    transition: background-color .1s ease;
  }
  .row:hover { background: var(--hover); }
  .row.sel { background: var(--sel-bg); box-shadow: inset 2px 0 0 var(--accent); }
  .row:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .row .name {
    display: flex; align-items: center; gap: 8px;
    overflow: hidden; white-space: nowrap;
  }
  .row .name .nm { overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
  .row .name .qtag, .row .name .ptag {
    flex: none; font-size: 10px; line-height: 1;
  }
  .row .name .qtag { padding: 3px 5px; border-radius: 4px;
    border: 1px solid var(--line-2); color: var(--dim); }
  .row .name .ptag { padding: 3px 2px; }
  .row .name .ptag.up { color: var(--info); }
  .row .name .ptag.dn { color: var(--dim); }
  .row .name .ptag.lm { color: var(--amber); }
  .row .name .ptag.ok { color: var(--ok); }
  .fico { width: 22px; height: 22px; flex: none; border-radius: 5px; display: flex;
    align-items: center; justify-content: center;
    font: 700 8.5px/1 system-ui, sans-serif; letter-spacing: .02em;
    background: var(--track); color: var(--txt-2); text-transform: uppercase; }
  .row > div { overflow: hidden; white-space: nowrap; }
  #head > div, .row > div { padding: 0 8px; }
  #head > div:first-child, .row > div:first-child { padding-left: 0; }
  #head > div:last-child, .row > div:last-child { padding-right: 0; }
  .num, .dim { text-align: right; font-variant-numeric: tabular-nums; }
  .dim { color: var(--dim); font-size: 11.5px; }
  /* status is colored text; the label itself carries the meaning */
  .row .st { justify-self: start; font-size: 11.5px; font-weight: 600; text-align: left; }
  .st.running { color: var(--ok); }
  .st.confirming, .st.resolving { color: var(--dim); }
  .st.paused { color: var(--amber); }
  .st.queued { color: var(--info); }
  .st.failed { color: var(--red); }
  .st.completed { color: var(--ok); }
  .st.cancelled { color: var(--dim); }
  .st.missing { color: var(--amber); }
  .st.retrying { color: var(--info); }

  .row > .pcol { display: flex; align-items: center; gap: 8px; }
  .cellbar {
    position: relative; height: 5px; flex: 1; border-radius: 999px; overflow: hidden;
    background: var(--track);
  }
  .cellbar > .fill {
    position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px;
    transition: width .35s linear, background-color .2s;
  }
  /* shimmer marks a real state: bytes are moving in this row right now */
  .cellbar.pulse > .fill::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.25) 50%, transparent 100%);
    animation: barShimmer 1.8s infinite linear;
  }
  .dv-fill.pulse::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.25) 50%, transparent 100%);
    animation: barShimmer 1.8s infinite linear;
  }
  @keyframes barShimmer {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
  }
  .pct { width: 30px; flex: none; text-align: right; font-size: 11px;
    color: var(--dim); font-variant-numeric: tabular-nums; }
  .row .spd { color: var(--txt-2); font-size: 12px; }

  /* ---- details dialog ---- */
  #dlg.wide { width: 560px; }
  .dt-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; min-width: 0; }
  .dt-head .dt-name { font-weight: 650; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; user-select: text; }
  .dt-head .dt-st { margin-left: auto; flex: none; font-size: 11px; }
  .errline { display: none; margin: 0 0 10px; color: var(--red); font-size: 11.5px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; user-select: text; }
  .errline.on { display: block; }
  .dgrid { display: grid; grid-template-columns: 96px 1fr 96px 1fr; gap: 4px 10px; font-size: 11.5px; margin-bottom: 14px; }
  .dgrid .k { color: var(--dim); }
  .dgrid .v { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; user-select: text; }
  .dt-gtitle { font-size: 11px; font-weight: 600; color: var(--dim); margin-bottom: 6px; }
  .dgraph { width: 100%; height: 96px; display: block; border: 1px solid var(--line-2);
    border-radius: 6px; background: var(--surface); }

  /* ---- details dialog v2 ---- */
  .dv { display: flex; flex-direction: column; gap: 12px; }
  .dv-head { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .dv-ico { width: 32px; height: 32px; flex: none; border-radius: 6px; display: flex;
    align-items: center; justify-content: center;
    font: 700 9.5px/1 system-ui, sans-serif; letter-spacing: .02em;
    background: var(--track); color: var(--txt-2); }
  .dv-titles { min-width: 0; }
  .dv-name { font-weight: 650; font-size: 13px; overflow: hidden; white-space: nowrap;
    text-overflow: ellipsis; user-select: text; }
  .dv-sub { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 11.5px; color: var(--dim); }
  .dv-sub .dot { opacity: .5; }
  .dv-track { position: relative; height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .dv-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px;
    transition: width .35s linear, background-color .2s; }
  .dv-meta-line { display: flex; justify-content: space-between; margin-top: 5px;
    font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .dv-meta-line .live { color: var(--txt-2); }
  .kvgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 16px; }
  .kvgrid.c3 { grid-template-columns: repeat(3, 1fr); }
  .kv { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .kv b { font-size: 12.5px; font-weight: 650; color: var(--txt); font-variant-numeric: tabular-nums;
    min-height: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .kv small { font-size: 11px; font-weight: 600; color: var(--dim); }
  .dv-path { display: flex; gap: 7px; align-items: center; font-size: 11.5px; color: var(--dim); }
  .dv-path span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; user-select: text; flex: 1; }
  .dv-path svg { width: 13px; height: 13px; flex: none; opacity: .7; }
  .dv-sha { margin-top: 6px; font-size: 10.5px; color: var(--dim); font-family: ui-monospace, monospace;
    cursor: default; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; user-select: text; }
  .dv-sha:hover { color: var(--txt-2); }
  .dv-btn-copy {
    border: none; background: transparent; padding: 2px 6px; border-radius: 4px;
    font-size: 10.5px; color: var(--accent); cursor: default;
    transition: background-color .12s ease;
  }
  .dv-btn-copy:hover { background: var(--hover); }
  .dv-btn-copy:active { transform: scale(.97); }

  /* ---- compact detail window (background offers) ---- */
  html[data-mode="detail"] #titlebar,
  html[data-mode="detail"] #main,
  html[data-mode="detail"] #status,
  html[data-mode="detail"] #modal,
  html[data-mode="detail"] #ctx { display: none !important; }
  #detail-root { display: none; }
  html[data-mode="detail"] #detail-root {
    display: flex; flex-direction: column; gap: 12px; height: 100%;
    padding: 14px 16px 16px; overflow-y: auto;
  }
  .dc-head { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
  .dc-titles { min-width: 0; flex: 1; }
  .dc-name { font-weight: 650; font-size: 13px; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    user-select: text; word-break: break-all; }
  .dc-sub { margin-top: 2px; font-size: 11.5px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
  .dc-sub .dot { opacity: .5; }
  .dc-x { flex: none; width: 26px; height: 26px; margin: -2px -4px 0 0; border: none; border-radius: 6px;
    background: transparent; color: var(--dim); font-size: 12px; line-height: 1; cursor: default; }
  .dc-x:hover { background: var(--hover); color: var(--txt); }
  .dc-x:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .dc-graph { width: 100%; height: 76px; display: block; border: 1px solid var(--line-2);
    border-radius: 6px; background: var(--surface); }
  .dc-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 2px; }
  .dc-actions button { flex: 1; height: 30px; padding: 0 10px; border: 1px solid var(--ctl);
    border-radius: 6px; background: var(--btn-bg); color: var(--txt); font-size: 12px; cursor: default;
    transition: background-color .12s ease, border-color .12s ease; }
  .dc-actions button:hover { background: var(--btn-hi); border-color: var(--ctl-hov); }
  .dc-actions button:active { background: var(--btn-act); }
  .dc-actions button:disabled { opacity: .45; pointer-events: none; }
  .dc-actions button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .dc-actions button.pri { border-color: transparent; color: #fff; background: var(--accent-btn); }
  .dc-actions button.pri:hover { background: var(--accent-hi); }
  .dc-actions button.pri:active { background: var(--accent-act); }
  .dc-err { display: none; color: var(--red); font-size: 11.5px; user-select: text;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .dc-err.on { display: block; }

  /* ---- status bar ---- */
  #status {
    height: 26px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 12px;
    background: var(--bg); border-top: 1px solid var(--line);
    font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums;
  }
  #s-conn { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  #s-conn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
  #s-conn.ok .dot { background: var(--ok); }
  #s-conn.bad .dot { background: var(--red); }

  /* ---- modal ---- */
  #modal {
    position: fixed; inset: 0; background: rgba(15,17,21,.42);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden; transition: opacity .16s ease-out, visibility .16s;
  }
  #modal.open { opacity: 1; visibility: visible; }
  #dlg {
    width: 400px; max-width: calc(100vw - 32px);
    max-height: calc(100vh - 40px);
    display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px;
    box-shadow: 0 16px 40px rgba(10,12,16,.25), 0 2px 8px rgba(10,12,16,.12);
    padding: 16px 18px;
    transform: scale(.97) translateY(4px);
    transition: transform .16s ease-out;
  }
  #modal.open #dlg { transform: scale(1) translateY(0); }
  #dlg h3 { margin: 0 0 12px; font-size: 13px; flex: none; }
  /* tall dialogs scroll their fields; the action row stays pinned */
  #dlg .dlgbody { overflow-y: auto; min-height: 0; flex: 1; margin: 0 -6px; padding: 0 6px; }
  #dlg .sec {
    flex: none; margin: 16px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
    font-size: 11.5px; font-weight: 600; color: var(--dim);
  }
  #dlg .dlgbody .sec:first-child { margin-top: 0; }
  #dlg input, #dlg select, #dlg textarea {
    width: 100%; padding: 7px 10px; margin-bottom: 12px;
    border: 1px solid var(--ctl); border-radius: 6px; font: inherit;
    background: var(--input-bg); color: var(--txt);
    transition: border-color .12s ease;
  }
  #dlg input:hover, #dlg select:hover, #dlg textarea:hover { border-color: var(--ctl-hov); }
  #dlg textarea { resize: vertical; min-height: 34px; line-height: 1.4; }
  #dlg input:focus-visible, #dlg select:focus-visible, #dlg textarea:focus-visible {
    outline: 2px solid var(--focus); outline-offset: -1px; border-color: var(--focus);
  }
  #dlg .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  #dlg .btns .lead { margin-right: auto; }
  #dlg button {
    padding: 6px 16px; border: 1px solid var(--ctl); border-radius: 6px; cursor: default;
    background: var(--btn-bg); color: var(--txt);
    transition: background-color .12s ease, border-color .12s ease;
  }
  #dlg button:hover { background: var(--btn-hi); border-color: var(--ctl-hov); }
  #dlg button:active { background: var(--btn-act); transform: scale(.98); }
  #dlg button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  #dlg button.pri { border-color: transparent; color: #fff; background: var(--accent-btn); }
  #dlg button.pri:hover { background: var(--accent-hi); border-color: transparent; }
  #dlg button.pri:active { background: var(--accent-act); transform: scale(.98); }
  .mhint { font-size: 11.5px; color: var(--dim); margin: -4px 0 12px; min-height: 14px; }
  #dlg .prio-opts { display: flex; gap: 8px; margin-bottom: 12px; }
  #dlg .prio-opts .prio { flex: 1; padding: 8px 0; }
  #dlg .prio-opts .prio.cur { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  #dlg .btns { padding-top: 12px; flex: none; }
  #dlg.hasbody .btns { border-top: 1px solid var(--line); margin-top: 10px; }
  .empty {
    grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 60px 24px; text-align: center; color: var(--dim);
  }
  .empty svg { width: 26px; height: 26px; margin-bottom: 8px; color: var(--dim-2); }
  .empty .ttl { font-size: 13px; font-weight: 600; color: var(--txt-2); }
  .empty .empty-hint { max-width: 300px; font-size: 12px; color: var(--dim); }
  .empty button {
    margin-top: 10px; height: 30px; padding: 0 14px;
    border: 1px solid var(--ctl); border-radius: 6px;
    background: var(--btn-bg); color: var(--txt); font-size: 12px; cursor: default;
    transition: background-color .12s ease, border-color .12s ease;
  }
  .empty button:hover { background: var(--btn-hi); border-color: var(--ctl-hov); }
  .empty button:active { background: var(--btn-act); transform: scale(.98); }
  .empty button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  /* ---- context menu ---- */
  #ctx {
    position: fixed; z-index: 60; min-width: 190px; display: none; padding: 4px;
    background: var(--menu-bg); border: 1px solid var(--line-2); border-radius: 8px;
    box-shadow: 0 10px 28px rgba(10,12,16,.2);
  }
  #ctx.open { display: block; }
  #ctx button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 7px 10px; border: none; border-radius: 5px;
    background: transparent; font: inherit; color: var(--txt); text-align: left; cursor: default;
    transition: background-color .1s ease;
  }
  #ctx button:hover { background: var(--menu-hov); }
  #ctx button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  #ctx button:disabled { opacity: .35; pointer-events: none; }
  #ctx button svg { width: 14px; height: 14px; flex: none; color: var(--dim); }
  #ctx .sep { height: 1px; margin: 4px 8px; background: var(--line); }

  /* ---- toast ---- */
  #toast {
    position: fixed; left: 50%; bottom: 36px; z-index: 90;
    transform: translateX(-50%) translateY(6px);
    background: var(--toast-bg); color: var(--toast-txt);
    padding: 8px 14px; border-radius: 8px; font-size: 12px;
    max-width: 70vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    box-shadow: 0 8px 24px rgba(0,0,0,.28);
    opacity: 0; pointer-events: none;
    transition: opacity .16s ease-out, transform .16s ease-out;
  }
  #toast.on { opacity: 1; transform: translateX(-50%); }
  /* clipboard offer: quiet bottom-right card, one action, no focus steal */
  #clipoff {
    position: fixed; right: 16px; bottom: 36px; z-index: 89;
    display: flex; align-items: center; gap: 10px;
    background: var(--toast-bg); color: var(--toast-txt);
    padding: 9px 10px 9px 14px; border-radius: 8px; font-size: 12px;
    max-width: min(440px, 86vw); box-shadow: 0 8px 24px rgba(0,0,0,.28);
    opacity: 0; pointer-events: none; transform: translateY(6px);
    transition: opacity .16s ease-out, transform .16s ease-out;
  }
  #clipoff.on { opacity: 1; pointer-events: auto; transform: none; }
  #clipoff .co-txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  #clipoff .co-btns { display: flex; gap: 6px; flex: none; }
  #clipoff button { border: 0; border-radius: 5px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  #clipoff .co-dl { background: #1f7a32; color: #fff; }
  #clipoff .co-x { background: rgba(255,255,255,.14); color: var(--toast-txt); }
  /* exact path the daemon will remove, shown in the delete dialog */
  .delpath {
    font: 500 11px/1.45 ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    background: var(--track); border-radius: 6px; padding: 7px 10px;
    word-break: break-all; user-select: text; color: var(--txt);
  }
  .delpath.dir { color: var(--red); }
  #dlg .fld { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  #dlg .fld label { width: 112px; flex: none; color: var(--txt-2); line-height: 1.25; }
  #dlg .fld input, #dlg .fld select { flex: 1; margin: 0; min-width: 0; }
  #dlg .fld input.narrow { flex: 0 0 108px; }
  #dlg .fld input.chk { flex: 0 0 auto; width: 15px; height: 15px; accent-color: var(--accent-btn); }
  /* checkbox + inline caption inside a field row (e.g. delete confirmation) */
  #dlg .fld > label.fchk { width: auto; display: inline-flex; align-items: center; gap: 8px; font-weight: 400; color: var(--txt-2); cursor: pointer; }
  #dlg .fld > label.fchk input { flex: 0 0 auto; width: 15px; height: 15px; margin: 0; accent-color: var(--accent-btn); }
  #dlg .ftypes { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 7px 10px; align-items: center; }
  #dlg .ftypes .fchk:first-child { grid-column: 1 / -1; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
  #dlg .ftypes .fchk { display: inline-flex; align-items: center; gap: 6px; width: auto; min-width: 96px; font-weight: 400; color: var(--txt-2); cursor: pointer; }
  #dlg .ftypes .fchk input { flex: 0 0 auto; width: 14px; height: 14px; accent-color: var(--accent-btn); margin: 0; }
  #dlg .ftypes.all .fchk:nth-child(n+2) { opacity: .4; }
  /* category folder overrides: only customized ones are listed */
  #dlg .cathint { font-size: 11.5px; color: var(--dim); margin: 0 0 10px; line-height: 1.35; }
  #dlg .ovrow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  #dlg .ovrow > span { width: 84px; flex: none; font-size: 11.5px; color: var(--txt-2); }
  #dlg .ovrow input { margin: 0; }
  #dlg .ovdel {
    flex: none; width: 26px; height: 26px; padding: 0; cursor: default;
    border: 1px solid var(--ctl); background: var(--btn-bg); color: var(--dim); border-radius: 5px;
  }
  #dlg .ovdel:hover { color: var(--red); border-color: var(--red); background: var(--btn-bg); }
  #dlg .ovdel:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  /* settings form: label above the control, grouped rows */
  #dlg .fgrp { display: flex; flex-direction: column; gap: 5px; min-width: 0; margin-bottom: 13px; }
  #dlg .fgrp > label, #dlg .fgrp > span { font-size: 11px; font-weight: 600; color: var(--dim); }
  #dlg .fgrp input, #dlg .fgrp select { margin: 0; }
  #dlg .frow { display: grid; gap: 10px; margin-bottom: 13px; }
  #dlg .frow.c2 { grid-template-columns: 1fr 1fr; }
  #dlg .frow.c3 { grid-template-columns: repeat(3, 1fr); }
  #dlg .frow .fgrp { margin-bottom: 0; }

  /* settings dialog: tabs + compact rows */
  #dlg.settings { width: 560px; }
  #dlg .tabs {
    display: flex; gap: 2px; margin: 0 0 12px; border-bottom: 1px solid var(--line); flex: none;
  }
  #dlg .tabs button {
    padding: 8px 12px; border: 0; cursor: default; margin-bottom: -1px; font-size: 12px;
    background: none; color: var(--dim);
    border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0;
  }
  #dlg .tabs button:hover { color: var(--txt); background: var(--btn-hi); }
  #dlg .tabs button.on { color: var(--txt); border-bottom-color: var(--accent); font-weight: 600; }
  #dlg .tabs button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  #dlg .tabpane { display: none; }
  #dlg .tabpane.on { display: block; }
  /* settings form: label above the control, grouped rows */
  /* folder row: path input + attached browse button */
  #dlg .fldpath { flex: 1; display: flex; min-width: 0; }
  #dlg .fldpath input { flex: 1; min-width: 0; border-radius: 6px 0 0 6px; border-right: 0; }
  #dlg .fldpath button {
    flex: none; width: 40px; padding: 0; margin: 0; display: grid; place-items: center;
    border: 1px solid var(--ctl); border-left: 0; border-radius: 0 6px 6px 0;
    background: var(--btn-bg); color: var(--txt-2); cursor: default;
  }
  #dlg .fldpath button:hover { color: var(--txt); border-color: var(--ctl-hov); background: var(--btn-hi); }
  #dlg .fldpath button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  #dlg .fldpath button svg { width: 15px; height: 15px; }
  /* DNS: mode select with the custom URL field attached underneath */
  #dlg .dnsgrp {
    flex: 1; display: flex; flex-direction: column; min-width: 0;
    border: 1px solid var(--ctl); border-radius: 6px; background: var(--input-bg);
    transition: border-color .12s ease;
  }
  #dlg .dnsgrp:hover { border-color: var(--ctl-hov); }
  #dlg .dnsgrp:focus-within { outline: 2px solid var(--focus); outline-offset: -1px; border-color: var(--focus); }
  #dlg .dnsgrp select, #dlg .dnsgrp input { border: 0; background: none; }
  #dlg .dnsgrp select:focus-visible, #dlg .dnsgrp input:focus-visible { outline: none; }
  #dlg .dnsgrp select { border-radius: 6px 6px 0 0; }
  #dlg .dnsgrp input {
    display: none; border-radius: 0 0 6px 6px; border-top: 1px solid var(--line);
    font-family: inherit;
  }
  #dlg .dnsgrp.custom input { display: block; }
  /* interface tab: full-width toggle rows, checkbox right-aligned */
  #dlg label.tgl {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 2px; margin-bottom: 0; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  #dlg label.tgl:last-of-type { border-bottom: 0; }
  #dlg label.tgl span { font-size: 12px; color: var(--txt); }
  #dlg label.tgl input { flex: 0 0 auto; width: 15px; height: 15px; margin: 0; accent-color: var(--accent-btn); }
  #dlg label.tgl:hover span { color: var(--accent); }
  /* category folders: "+ add" select reads as an action, not a data field */
  #dlg .ovadd { margin-top: 8px; }
  #dlg .ovadd select {
    border: 1px dashed var(--ctl); background: none; color: var(--dim); margin-bottom: 0;
    text-align: center; text-align-last: center; appearance: none; -webkit-appearance: none; cursor: default;
  }
  #dlg .ovadd select:hover { color: var(--txt); border-color: var(--accent); background: var(--btn-hi); }

  /* ---- scrollbars ---- */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--sb); border: 2px solid var(--edge); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--sb-hi); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
<script>
  // apply the saved theme before first paint (settings.json mirror in
  // localStorage; the authoritative copy arrives with get_settings)
  (() => {
    const mq = matchMedia("(prefers-color-scheme: dark)");
    const pref = localStorage.rdm_theme || "system";
    const eff = pref === "dark" || (pref === "system" && mq.matches) ? "dark" : "light";
    const el = document.documentElement;
    el.dataset.theme = eff;
    el.style.colorScheme = eff;
  })();
</script>
</head>
