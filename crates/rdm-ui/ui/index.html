<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Rust Download Manager</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f4f0; --chrome: #f7f6f2; --chrome-hi: #fdfcfa; --chrome-lo: #eeede7; --chrome-act: #e5e3da;
    --line: #e4e2d9; --line2: #d6d3c7; --line-hov: #c3c0b2;
    --txt: #23262b; --dim: #6a6f76; --txt2: #4a4e54; --dim2: #8b8e93;
    --accent: #2f6fb8; --sel: #316ac5; --sel-bg: #e3eefd; --sel-edge: #27509e;
    --green: #2e8b30; --green-hi: #57b85c;
    --amber: #96520a; --red: #c0392b; --fill-fail: #d9534f; --fill-pause: #d99a2b;
    --track: #eceeec; --track2: #eaeceb;
    --panel: #fff; --panel-hi: #fbfaf8; --hover: #f3f6fa; --rowline: #f5f4ef;
    --cat-sel: #e7eefb; --cat-sel-txt: #1d4d8f; --cat-sel-cnt: #4d6f9f;
    --done: #0a5d0e; --sel-dim: #5c6470;
    --input-bg: #fff; --btn-bg: #fff; --btn-hi: #f4f2ea; --btn-act: #eae7dc;
    --menu-bg: #fdfcfa; --menu-hov: #e9effb;
    --sb: #d8d5ca; --sb-hi: #c3c0b2; --sb-edge: #fff;
    --focus: #8fb1e6;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #1a1c20; --chrome: #202329; --chrome-hi: #252931; --chrome-lo: #282d36; --chrome-act: #313742;
    --line: #2b3039; --line2: #373d4a; --line-hov: #485060;
    --txt: #e2e6eb; --dim: #9aa2b0; --txt2: #c5cbd4; --dim2: #848c99;
    --accent: #4f8ddb; --sel: #3f6fb8; --sel-bg: #24344b; --sel-edge: #2f5aa8;
    --green: #48bb52; --green-hi: #62cf6c;
    --amber: #e5a43b; --red: #e66255; --fill-fail: #d9534f; --fill-pause: #d99a2b;
    --track: #262930; --track2: #2c3038;
    --panel: #1e2127; --panel-hi: #22262d; --hover: #262b34; --rowline: #242830;
    --cat-sel: #24344b; --cat-sel-txt: #9cc2f0; --cat-sel-cnt: #6f92c4;
    --done: #48bb52; --sel-dim: #b0b8c6;
    --input-bg: #181a1f; --btn-bg: #262a32; --btn-hi: #2e333d; --btn-act: #363c48;
    --menu-bg: #22262d; --menu-hov: #29354a;
    --sb: #3a404c; --sb-hi: #474f5e; --sb-edge: #1e2127;
    --focus: #6097e6;
  }
  * { box-sizing: border-box; user-select: none; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 12px/1.45 system-ui, "Segoe UI", Ubuntu, "Noto Sans", "DejaVu Sans", sans-serif;
    color: var(--txt);
    background: var(--bg);
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  input, select { user-select: text; }
  button { font: inherit; }

  /* ---- custom titlebar (undecorated main window) ---- */
  #titlebar {
    display: flex; align-items: center; gap: 2px; height: 34px;
    padding: 0 6px 0 12px; flex: none;
    background: var(--chrome); border-bottom: 1px solid var(--line);
  }
  #titlebar .tb-title { font-size: 11.5px; font-weight: 650; letter-spacing: .02em; color: var(--txt2); }
  #titlebar .tb-grow { flex: 1; }
  .tb-btn {
    width: 30px; height: 24px; display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: 7px; background: transparent; color: var(--dim);
    transition: background-color .12s ease, color .12s ease, transform .08s ease;
  }
  .tb-btn:hover { background: var(--chrome-lo); color: var(--txt); }
  .tb-btn:active { background: var(--chrome-act); transform: scale(.94); }
  .tb-btn.cls:hover { background: #d9534f; color: #fff; }
  .tb-btn svg { width: 12px; height: 12px; }

  /* ---- toolbar ---- */
  #toolbar {
    display: flex; align-items: center; gap: 2px; padding: 0 10px; height: 46px; flex: none;
    background: var(--chrome);
    border-bottom: 1px solid var(--line);
  }
  .tbtn {
    display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px;
    border: 1px solid transparent; border-radius: 8px;
    background: transparent; color: var(--txt2); cursor: default;
    transition: background-color .15s cubic-bezier(.16,1,.3,1), color .15s cubic-bezier(.16,1,.3,1), border-color .15s cubic-bezier(.16,1,.3,1), transform .08s ease;
  }
  .tbtn:hover { background: var(--chrome-lo); color: var(--txt); }
  .tbtn:active { background: var(--chrome-act); transform: scale(.97); }
  .tbtn[disabled] { opacity: .38; pointer-events: none; }
  .tbtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .tbtn svg { width: 16px; height: 16px; flex: none; color: var(--dim); transition: color .15s ease; }
  .tbtn:hover svg { color: var(--txt2); }
  .tbtn span { font-size: 11.5px; }
  /* icon-only toolbar buttons (priority up/down): square hit area */
  .tbtn.ico { padding: 0; width: 32px; justify-content: center; gap: 0; }
  /* one filled control: the primary action owns the accent */
  #b-add { background: var(--accent); color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  #b-add:hover { background: #275f9f; color: #fff; }
  #b-add:active { background: #22548d; transform: scale(.97); }
  #b-add svg, #b-add:hover svg { color: #fff; }
  .tsep { width: 1px; height: 18px; margin: 0 6px; flex: none; background: var(--line2); }
  #spacer { flex: 1; }

  /* ---- main split ---- */
  #main { flex: 1; display: flex; min-height: 0; background: var(--panel); }

  /* ---- categories ---- */
  #cats {
    width: 172px; flex: none; background: var(--chrome);
    border-right: 1px solid var(--line);
    padding: 12px 8px; overflow-y: auto;
  }
  #cats h3 {
    margin: 0 0 8px; padding: 0 9px; font-size: 11px; font-weight: 600; color: var(--dim);
  }
  #cats h3 + #catlist + h3 { margin-top: 16px; }
  .cat .ic.qi { border-radius: 3px; }
  .cat {
    display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 9px;
    border-radius: 7px; cursor: default; color: var(--txt2);
    transition: background-color .12s ease, color .12s ease;
  }
  .cat:hover { background: var(--chrome-lo); }
  .cat.sel { background: var(--cat-sel); color: var(--cat-sel-txt); }
  .cat .ic { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .cat .cnt { margin-left: auto; font-size: 11px; color: var(--dim2); font-variant-numeric: tabular-nums; }
  .cat.sel .cnt { color: var(--cat-sel-cnt); }

  /* ---- queues ---- */
  #qlist .cat .ic.qi { width: 9px; height: 9px; border-radius: 3px; }
  #qlist .cat .run-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); flex: none; }
  #qlist .cat.drop { background: var(--cat-sel); color: var(--cat-sel-txt); box-shadow: inset 0 0 0 1px var(--accent); }
  /* scheduler position, shown only inside a queue view */
  .row .rank { width: 15px; flex: none; text-align: center; color: var(--dim2);
    font-size: 10px; font-variant-numeric: tabular-nums; }
  /* queue header strip above the table when a queue is open */
  #qhead { display: flex; align-items: center; gap: 10px; height: 38px; flex: none;
    padding: 0 14px; background: var(--panel-hi); border-bottom: 1px solid var(--line); font-size: 11.5px; }
  #qhead[hidden] { display: none; }
  #qhead .qdot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  #qhead .qname { font-weight: 650; font-size: 12.5px; }
  #qhead .qmeta { color: var(--dim); font-variant-numeric: tabular-nums; }
  #qhead .qgrow { flex: 1; }
  .qbtn { display: inline-flex; align-items: center; gap: 6px; height: 25px; padding: 0 10px;
    border: 1px solid var(--line2); border-radius: 7px; background: var(--btn-bg); color: var(--txt2);
    font-size: 11px; cursor: default;
    transition: background-color .12s ease, border-color .12s ease, color .12s ease; }
  .qbtn:hover { background: var(--btn-hi); border-color: var(--line-hov); color: var(--txt); }
  .qbtn:active { background: var(--btn-act); transform: scale(.97); }
  .qbtn[disabled] { opacity: .4; pointer-events: none; }
  .qbtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .qbtn svg { width: 11px; height: 11px; flex: none; }
  .qbtn.go svg { color: var(--green); }
  /* queue picker: pick an existing label or type a new one */
  #dlg .qopts { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; }
  #dlg .qopt { display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 10px;
    border: 1px solid transparent; border-radius: 8px; background: transparent;
    font: inherit; color: var(--txt2); text-align: left; cursor: default;
    transition: background-color .12s ease; }
  #dlg .qopt:hover { background: var(--hover); }
  #dlg .qopt .ic { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  #dlg .qopt .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #dlg .qopt .cnt { font-size: 11px; color: var(--dim2); font-variant-numeric: tabular-nums; }
  #dlg .qopt .ck { width: 14px; height: 14px; flex: none; color: var(--accent); visibility: hidden; }
  #dlg .qopt.cur { background: var(--cat-sel); color: var(--cat-sel-txt); border-color: var(--sel-edge); }
  #dlg .qopt.cur .cnt { color: var(--cat-sel-cnt); }
  #dlg .qopt.cur .ck { visibility: visible; }
  #dlg .qopt:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  #dlg .qnew { display: flex; gap: 8px; margin-bottom: 10px; }
  #dlg .qnew input { flex: 1; min-width: 0; margin: 0; }
  #dlg .qnew button { flex: none; padding: 6px 14px; }

  /* ---- table ---- */
  #listwrap { flex: 1; min-width: 0; background: var(--panel); display: flex; flex-direction: column; }
  #head, .row {
    display: grid;
    grid-template-columns: minmax(180px, 1fr) 84px 148px 96px 74px 88px;
    align-items: center;
    padding: 0 12px;
  }
  #head {
    height: 32px; flex: none;
    background: var(--panel-hi);
    border-bottom: 1px solid var(--line);
    font-weight: 600; font-size: 11px; color: var(--dim);
  }
  #rows { flex: 1; overflow-y: auto; }
  .row {
    height: 42px; cursor: default;
    border-bottom: 1px solid var(--rowline);
    transition: background-color .1s ease;
  }
  .row:hover { background: var(--hover); }
  .row.sel { background: var(--sel-bg); box-shadow: inset 2px 0 0 var(--accent); }
  .row:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .row.sel .dim { color: var(--sel-dim); }
  .row .name {
    display: flex; align-items: center; gap: 9px;
    overflow: hidden; white-space: nowrap;
  }
  .row .name .nm { overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  .row .name .qtag, .row .name .ptag {
    flex: none; font-size: 9.5px; line-height: 1; padding: 3px 6px;
    border-radius: 999px; background: var(--track); color: var(--dim);
  }
  .row .name .ptag { padding: 3px 4px; }
  .row .name .ptag.up { color: #4a7bd0; }
  .row .name .ptag.dn { color: var(--dim); }
  .row .name .ptag.lm { color: var(--amber); }
  .row .name .ptag.ok { color: var(--green); }
  .fico { width: 22px; height: 22px; flex: none; border-radius: 6px; display: flex;
    align-items: center; justify-content: center; font: bold 9.5px/1 sans-serif; color: #fff; }
  .row > div { overflow: hidden; white-space: nowrap; }
  #head > div, .row > div { padding: 0 8px; }
  #head > div:first-child, .row > div:first-child { padding-left: 0; }
  #head > div:last-child, .row > div:last-child { padding-right: 0; }
  .num, .st, .dim { text-align: right; font-variant-numeric: tabular-nums; }
  .dim { color: var(--dim); font-size: 11.5px; }
  /* status is a chip inside rows; the header keeps the plain column label */
  .row .st {
    justify-self: start; display: inline-flex; align-items: center;
    padding: 2px 9px; border-radius: 999px;
    font-size: 10.5px; font-weight: 600; text-align: left;
  }
  .st.running { color: var(--green); background: rgba(83,179,86,.13); }
  .st.confirming, .st.resolving { color: var(--dim); background: var(--track); }
  .st.paused { color: var(--amber); background: rgba(217,164,65,.14); }
  .st.queued { color: #4a7bd0; background: rgba(74,123,208,.14); }
  .st.failed { color: var(--red); background: rgba(224,104,92,.14); }
  .st.completed { color: var(--done); background: rgba(83,179,86,.13); }
  .st.cancelled { color: var(--dim); background: var(--track); }
  .st.missing { color: var(--amber); background: rgba(217,164,65,.14); }
  .st.retrying { color: #4a7bd0; background: rgba(74,123,208,.14); }

  .row > .pcol { display: flex; align-items: center; gap: 8px; }
  .cellbar {
    position: relative; height: 6px; flex: 1; border-radius: 999px; overflow: hidden;
    background: var(--track2);
  }
  .cellbar > .fill {
    position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px;
    transition: width .4s cubic-bezier(.16,1,.3,1), background-color .2s;
  }
  .cellbar.pulse > .fill::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.22) 50%, transparent 100%);
    animation: barShimmer 1.8s infinite linear;
  }
  @keyframes barShimmer {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
  }
  .pct { width: 32px; flex: none; text-align: right; font-size: 10.5px;
    color: var(--dim); font-variant-numeric: tabular-nums; }
  .row .spd { color: var(--txt2); font-size: 11.5px; }

  /* ---- details dialog ---- */
  #dlg.wide { width: 560px; }
  .dt-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; min-width: 0; }
  .dt-head .dt-name { font-weight: 650; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; user-select: text; }
  .dt-head .dt-st { margin-left: auto; flex: none; font-size: 11px; }
  /* percent sits inside the bar so the bar keeps the full dialog width */
  .bigbar { position: relative; height: 16px; margin-bottom: 10px; overflow: hidden;
    background: var(--track); border-radius: 999px; }
  .bigbar > .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px;
    transition: width .45s linear, background-color .2s; }
  .errline { display: none; margin: 0 0 10px; color: var(--red); font-size: 11px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; user-select: text; }
  .errline.on { display: block; }
  .dgrid { display: grid; grid-template-columns: 96px 1fr 96px 1fr; gap: 4px 10px; font-size: 11px; margin-bottom: 14px; }
  .dgrid .k { color: var(--dim); }
  .dgrid .v { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; user-select: text; }
  .dt-gtitle { font-size: 10px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
  .dgraph { width: 100%; height: 96px; display: block; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }

  /* ---- details dialog v2 ---- */
  .dv { display: flex; flex-direction: column; gap: 11px; }
  .dv-head { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .dv-ico { width: 34px; height: 34px; flex: none; border-radius: 10px; display: flex;
    align-items: center; justify-content: center; font: 700 10px/1 sans-serif; color: #fff; letter-spacing: .02em; }
  .dv-titles { min-width: 0; }
  .dv-name { font-weight: 650; font-size: 12.5px; overflow: hidden; white-space: nowrap;
    text-overflow: ellipsis; user-select: text; }
  .dv-sub { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 11px; color: var(--dim); }
  .dv-sub .dot { opacity: .5; }
  .dv-track { position: relative; height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .dv-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px;
    transition: width .4s cubic-bezier(.16,1,.3,1), background-color .2s; }
  .dv-fill.pulse::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.28) 50%, transparent 100%);
    animation: barShimmer 1.8s infinite linear;
  }
  .dv-meta-line { display: flex; justify-content: space-between; margin-top: 5px;
    font-size: 10.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .dv-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .dv-stat { background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 7px 10px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .dv-stat b { font-size: 12.5px; font-weight: 650; font-variant-numeric: tabular-nums;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .dv-stat small { font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--dim); }
  .dv-path { display: flex; gap: 7px; align-items: center; font-size: 11px; color: var(--dim); }
  .dv-path span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; user-select: text; flex: 1; }
  .dv-path svg { width: 13px; height: 13px; flex: none; opacity: .7; }
  .dv-sha { margin-top: 6px; font-size: 10.5px; color: var(--dim); font-family: ui-monospace, monospace;
    cursor: default; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; user-select: text; }
  .dv-sha:hover { color: var(--txt2); }
  .dv-btn-copy {
    border: none; background: transparent; padding: 2px 6px; border-radius: 5px;
    font-size: 10px; color: var(--accent); cursor: default;
    transition: background-color .12s, transform .08s;
  }
  .dv-btn-copy:hover { background: var(--hover); }
  .dv-btn-copy:active { transform: scale(.95); }

  /* ---- compact detail window (background offers) ---- */
  html[data-mode="detail"] #titlebar,
  html[data-mode="detail"] #toolbar,
  html[data-mode="detail"] #main,
  html[data-mode="detail"] #status,
  html[data-mode="detail"] #modal,
  html[data-mode="detail"] #ctx { display: none !important; }
  #detail-root { display: none; }
  html[data-mode="detail"] #detail-root {
    display: flex; flex-direction: column; gap: 11px; height: 100%;
    padding: 14px 16px 16px; overflow-y: auto;
  }
  .dc-head { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
  .dc-titles { min-width: 0; flex: 1; }
  .dc-name { font-weight: 650; font-size: 12.5px; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    user-select: text; word-break: break-all; }
  .dc-sub { margin-top: 2px; font-size: 11px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
  .dc-sub .dot { opacity: .5; }
  .dc-x { flex: none; width: 24px; height: 24px; margin: -2px -4px 0 0; border: none; border-radius: 7px;
    background: transparent; color: var(--dim); font-size: 12px; line-height: 1; }
  .dc-x:hover { background: var(--hover); color: var(--txt); }
  .dc-graph { width: 100%; height: 74px; display: block; border: 1px solid var(--line);
    border-radius: 10px; background: var(--panel); }
  .dc-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 2px; }
  .dc-actions button { flex: 1; padding: 7px 10px; border: 1px solid var(--line2);
    border-radius: 9px; background: var(--btn-bg); color: var(--txt);
    transition: background-color .12s ease, border-color .12s ease; }
  .dc-actions button:hover { background: var(--btn-hi); border-color: var(--line-hov); }
  .dc-actions button:active { background: var(--btn-act); transform: scale(.97); }
  .dc-actions button:disabled { opacity: .45; pointer-events: none; }
  .dc-actions button.pri { border-color: transparent; color: #fff; background: #3569b8; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .dc-actions button.pri:hover { background: #3d74c6; }
  .dc-actions button.pri:active { background: #2e5da3; transform: scale(.97); }
  .dc-err { display: none; color: var(--red); font-size: 11px; user-select: text;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .dc-err.on { display: block; }

  /* ---- status bar ---- */
  #status {
    height: 26px; flex: none; display: flex; align-items: center; gap: 18px; padding: 0 14px;
    background: var(--chrome); border-top: 1px solid var(--line);
    font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums;
  }
  #s-conn { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  #s-conn .dot { width: 6px; height: 6px; border-radius: 50%; background: #c9a520; }
  #s-conn.ok .dot { background: var(--green); }
  #s-conn.bad .dot { background: var(--red); }

  /* ---- modal ---- */
  #modal {
    position: fixed; inset: 0; background: rgba(14,16,20,.45);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden; transition: opacity .18s cubic-bezier(.16,1,.3,1), visibility .18s;
  }
  #modal.open { opacity: 1; visibility: visible; }
  #dlg {
    width: 400px; max-width: calc(100vw - 32px);
    max-height: calc(100vh - 40px);
    display: flex; flex-direction: column;
    background: var(--panel-hi); border: 1px solid var(--line2); border-radius: 12px;

// diag must never throw: it runs inside catch blocks, and __TAURI__ may not
// exist yet (injection race) or at all (file:// preview) — a crash here would
// abort the whole script and kill every button handler
const diag = (m) => {
  try { window.__TAURI__?.core?.invoke?.("diag", { msg: m })?.catch?.(() => {}); } catch {}
};
window.__rdmErrs = [];
window.addEventListener("error", (e) => { window.__rdmErrs.push(e.message); diag("onerror: " + e.message); });
let invoke = async () => { throw new Error("IPC not ready"); };
let listen = async () => () => {};
let detailWin = false;   // this webview is the compact "Download details" popup
// The Tauri global can appear after document-start on WebKitGTK; poll for it
// instead of binding once and dying when it is not there yet
function bindIpc() {
  const t = window.__TAURI__;
  if (t && t.core && t.core.invoke && t.event && t.event.listen) {
    invoke = t.core.invoke;
    listen = t.event.listen;
    try {
      if (t.window && t.window.getCurrentWindow) {
        detailWin = t.window.getCurrentWindow().label === "detail";
      }
    } catch {}
    if (detailWin) initDetailWindow();
    diag("boot ok");
    return true;
  }
  return false;
}
if (!bindIpc()) {
  let tries = 0;
  const iv = setInterval(() => {
    if (bindIpc() || ++tries > 200) clearInterval(iv);
  }, 50);
}

async function focusWindow() {
  try {
    const w = window.__TAURI__.window.getCurrentWindow();
    await w.show();
    await w.unminimize();

    // pin briefly on top so the compositor raises the window, then unpin
    await w.setAlwaysOnTop(true);
    await w.setFocus();
    setTimeout(() => { w.setAlwaysOnTop(false).catch(() => {}); }, 400);
  } catch (e) { diag("focus: " + (e.message || e)); }
}

/* ---------- custom titlebar (undecorated window) ---------- */
(() => {
  const win = () => {
    try { return window.__TAURI__.window.getCurrentWindow(); } catch { return null; }

  const guard = (p) => { if (p && p.catch) p.catch(() => {}); };

  const max = document.getElementById("w-max");
  const cls = document.getElementById("w-close");
  if (min) min.onclick = () => { const w = win(); if (w) guard(w.minimize()); };
  if (max) max.onclick = () => { const w = win(); if (w) guard(w.toggleMaximize()); };
  // close rides the CloseRequested handler: hides to tray instead of exiting
  if (cls) cls.onclick = () => { const w = win(); if (w) guard(w.close()); };
  const tb = document.getElementById("titlebar");
  if (tb) tb.addEventListener("dblclick", (e) => {
    // only the bare bar itself, never the buttons
    if (e.target.closest(".tb-btn")) return;
    const w = win(); if (w) guard(w.toggleMaximize());
  });
})();

}

function applyI18n() {

}

const EXT = {
  compressed: ["zip","rar","7z","tar","gz","bz2","xz","iso"],
  documents: ["pdf","doc","docx","xls","xlsx","ppt","pptx","txt","md","epub"],
  music: ["mp3","flac","wav","ogg","m4a","aac","opus"],

  programs: ["exe","msi","deb","rpm","appimage","apk","bin","dmg"],

function catOf(j) {
  const m = /\.([a-z0-9]+)$/i.exec(j.filename || "");
  const e = m ? m[1].toLowerCase() : "";
  for (const [k, list] of Object.entries(EXT)) if (list.includes(e)) return k;
  return "other";
}

/* ---------- helpers ---------- */
function fmt(n) {
  if (n == null) return "?";
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : 1)) + " " + u[i];
}
function fmtSpeed(bps) {
  if (!bps || bps < 1) return "0 B/s";
  return fmt(bps) + "/s";
}
function fmtEta(sec) {
  if (sec == null || !isFinite(sec) || sec < 0) return "∞";
  if (sec < 60) return Math.ceil(sec) + t("u_s");
  if (sec < 3600) return Math.floor(sec / 60) + t("u_m") + " " + Math.ceil(sec % 60) + t("u_s");
  return Math.floor(sec / 3600) + t("u_h") + " " + Math.ceil((sec % 3600) / 60) + t("u_m");
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function segGradient(segs, size) {
  // Alternating green stripes per completed segment
  if (!segs || !size) return "linear-gradient(90deg,#57b85c 0%,#57b85c 0%)";
  const full = "#57b85c", alt = "#3f9d46";
  const parts = [];
  segs.forEach((s, i) => {
    const a = (s.start / size) * 100, b = (s.done / Math.max(1, s.end - s.start + 1)) * 100;
    const c = i % 2 ? alt : full;
    if (b > 0) parts.push(`${c} ${a.toFixed(2)}%`, `${c} ${(a + ((b / 100) * ((s.end - s.start + 1) / size) * 100)).toFixed(2)}%`);
  });
  if (!parts.length) parts.push("transparent 0%", "transparent 0%");
  return `linear-gradient(90deg,${parts.join(",")})`;
}
function icoFor(j) {
  const k = catOf(j);
  const col = Object.fromEntries(CATS.map(([id, , c]) => [id, c]))[k] || "#888";
  const ch = { compressed: "Z", documents: "D", music: "♪", video: "▶", programs: "P", other: "?" }[k];
  return `<span class="fico" style="background:${col}">${ch}</span>`;
}

/* ---------- speed sampling ---------- */
function sampleSpeed(id, done) {
  const now = performance.now();
  let h = speeds.get(id);
  if (!h) { h = []; speeds.set(id, h); }
  h.push({ t: now, done });
  while (h.length > 2 && now - h[0].t > 6000) h.shift();
  if (h.length < 2) return 0;
  const a = h[0], b = h[h.length - 1];
  const dt = (b.t - a.t) / 1000;
  if (dt < 0.3) return 0;
  return Math.max(0, (b.done - a.done) / dt);
}

/* ---------- render ---------- */
let queueSel = "all"; // "all" or a queue label
let queueAssignNext = null; // queue view open when Add URL clicked: tag the next job
function visible() {
  const rows = [...jobs.values()]
    .filter((j) => cat === "all" || catOf(j) === cat)
    .filter((j) => queueSel === "all" || (j.queue || "main") === queueSel);
  // inside a queue the list mirrors the scheduler: priority first, FIFO after
  return queueSel === "all" ? rows.sort((a, b) => b.id - a.id)
    : rows.sort((a, b) => (b.priority || 0) - (a.priority || 0) || a.id - b.id);
}
function queueCounts() {
  const qs = new Map();
  for (const j of jobs.values()) {
    const q = j.queue || "main";
    qs.set(q, (qs.get(q) || 0) + 1);
  }
  return qs;
}
function qRun(q) {
  return [...jobs.values()].filter((j) => j.status === "running" && (q === "all" || (j.queue || "main") === q)).length;
}
// stable color per queue label so sidebar, header and picker agree
function queueColor(q) {
  let h = 0;
  for (let i = 0; i < q.length; i++) h = (h * 31 + q.charCodeAt(i)) % 360;
  return `hsl(${(h * 47 + 8) % 360},45%,52%)`;
}
function renderQueues() {
  const qs = queueCounts();
  const box = $("qlist");
  const custom = [...qs.entries()]
    .filter(([q]) => q !== "main")
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([q, cnt]) => [q, q, cnt]);
  if (queueSel !== "all" && !qs.has(queueSel)) queueSel = "all";
  const items = [["all", t("queue_all"), jobs.size], ...(qs.has("main") ? [["main", t("queue_main"), qs.get("main")]] : []), ...custom];
  $("q-sec").hidden = custom.length === 0 && !qs.has("main");
  box.innerHTML = items.map(([id, label, cnt]) => {
    const run = id !== "all" && qRun(id) > 0;
    const col = id === "all" || id === "main" ? "var(--dim)" : queueColor(id);
    return `<div class="cat ${queueSel === id ? "sel" : ""}" data-q="${esc(id)}" role="button" tabindex="0"
      title="${esc(t("items_fmt", { n: cnt, m: qRun(id) }))}">
      <span class="ic qi" style="background:${col}"></span>${esc(label)}${run ? '<span class="run-dot"></span>' : ""}
      <span class="cnt">${cnt}</span></div>`;
  }).join("");
  box.querySelectorAll(".cat").forEach((el) => {
    const pick = () => { queueSel = el.dataset.q; renderQueues(); renderRows(); };
    el.onclick = pick;
    el.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } };
    el.oncontextmenu = (e) => {
      const q = el.dataset.q;

    };
  });
}
function renderCats() {
  const counts = { all: jobs.size };
  for (const j of jobs.values()) { const k = catOf(j); counts[k] = (counts[k] || 0) + 1; }
  $("catlist").innerHTML = CATS.map(([id, label, col]) =>
    `<div class="cat ${cat === id ? "sel" : ""}" data-cat="${id}">
      <span class="ic" style="background:${col}"></span>${t(label)}
      <span class="cnt">${counts[id] || 0}</span></div>`).join("");

    (el.onclick = () => { cat = el.dataset.cat; renderCats(); renderRows(); }));

function estSize(j) {

/* ---------- graph ---------- */
/// The one number the speed card and the graph label agree on: the latest
/// smoothed sample (falling back to the rolling-average estimate).
function curSpeed(j) {
  const h = jobHist.get(j.id);
  return h && h.length ? h[h.length - 1].v : (j.speed || 0);
}
/// Distinct hue per segment index; 47 is coprime to 360 so up to ~30 bands
/// stay visually apart. Segment indices are stable across dynamic splits.
function segColor(i, a) {
  return `hsla(${(i * 47 + 8) % 360},60%,50%,${a})`;
}
function paintGraph(cv, samples) {
  if (!cv || !cv.getContext) return;
  lastGraph = [cv, samples];
  const ctx = cv.getContext("2d");
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(40, Math.round(r.width * dpr));
  const h = Math.max(24, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  ctx.clearRect(0, 0, w, h);
  const C = document.documentElement.dataset.theme === "dark"
    ? { grid: "#262b33", grid2: "#323844", line: "#48bb52", txt: "#9aa2b0" }
    : { grid: "#ebe8dc", grid2: "#dad6c6", line: "#2e8b30", txt: "#7a7a7a" };
  const vals = samples.map((s) => s.v);
  const max = Math.max(1024, ...vals) * 1.15;
  ctx.strokeStyle = C.grid;
  ctx.lineWidth = 0.75 * dpr;
  const step = 34 * dpr;
  for (let x = step; x < w; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = step; y < h; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  ctx.strokeStyle = C.grid2;
  ctx.beginPath(); ctx.moveTo(0, h - 1); ctx.lineTo(w, h - 1); ctx.stroke();
  const peak = Math.max(0, ...vals);
  if (peak >= 1 && samples.length > 1) {
    const n = samples.length;
    const x = (i) => (i / (n - 1)) * w;
    const y = (v) => h - (v / max) * (h - 4 * dpr) - 2 * dpr;
    const maxSeg = samples.reduce((m, s) => Math.max(m, s.seg ? s.seg.length : 0), 0);
    if (maxSeg > 1) {
      // stacked bands: one colored area per segment, total = outline on top
      const cums = samples.map((sm) => {
        const a = [0];
        (sm.seg || []).forEach((v) => a.push(a[a.length - 1] + v));
        return a;
      });
      for (let s = 0; s < maxSeg; s++) {
        ctx.beginPath();
        for (let i = 0; i < n; i++) { const yy = y(cums[i][s + 1] || 0); i ? ctx.lineTo(x(i), yy) : ctx.moveTo(x(i), yy); }
        for (let i = n - 1; i >= 0; i--) ctx.lineTo(x(i), y(cums[i][s] || 0));
        ctx.closePath();
        ctx.fillStyle = segColor(s, 0.6);
        ctx.fill();
      }
      ctx.beginPath();
      samples.forEach((sm, i) => { const yy = y(sm.v); i ? ctx.lineTo(x(i), yy) : ctx.moveTo(x(i), yy); });
      ctx.strokeStyle = C.line; ctx.lineWidth = 1.5 * dpr;
      ctx.lineJoin = "round";
      ctx.stroke();
      ctx.fillStyle = C.txt;
      ctx.font = `${10 * dpr}px system-ui, sans-serif`;
      ctx.fillText(fmt(max) + "/s", 4 * dpr, 10 * dpr);
      const lbl = `${maxSeg} seg`;
      ctx.fillText(lbl, w - ctx.measureText(lbl).width - 4 * dpr, 10 * dpr);
    } else {
      ctx.beginPath();
      vals.forEach((v, i) => {
        const yy = y(v);
        i ? ctx.lineTo(x(i), yy) : ctx.moveTo(x(i), yy);
      });
      ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      if (document.documentElement.dataset.theme === "dark") {
        grad.addColorStop(0, "rgba(72,187,82,.35)");
        grad.addColorStop(1, "rgba(72,187,82,.03)");
      } else {
        grad.addColorStop(0, "rgba(46,139,48,.30)");
        grad.addColorStop(1, "rgba(46,139,48,.03)");
      }
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.beginPath();
      vals.forEach((v, i) => {
        const yy = y(v);
        i ? ctx.lineTo(x(i), yy) : ctx.moveTo(x(i), yy);
      });
      ctx.strokeStyle = C.line; ctx.lineWidth = 1.5 * dpr;
      ctx.lineJoin = "round";
      ctx.stroke();
      ctx.fillStyle = C.txt;
      ctx.font = `${10 * dpr}px system-ui, sans-serif`;
      // label = current speed, matching the card (max only scales the axis)
      ctx.fillText(fmt(vals.length ? vals[vals.length - 1] : 0) + "/s", 4 * dpr, 10 * dpr);
    }
  } else {
    ctx.fillStyle = C.txt;
    ctx.font = `${10 * dpr}px system-ui, sans-serif`;
    ctx.fillText(fmt(vals.length ? vals[vals.length - 1] : 0) + "/s", 4 * dpr, 10 * dpr);
  }
}

function apply(v) {

    if (v[k] != null && j[k] !== v[k]) { j[k] = v[k]; if (k === "status" || k === "queue" || k === "priority") rebuild = true; }
  }
  if (v.missing != null) j.missing = v.missing;

listen("rdm", (ev) => {
  const m = ev.payload;
  switch (m.t) {
    case "disconnected": connected = false; setConn("bad"); break;
    case "jobs":
      if (!connected) { connected = true; diag("jobs n=" + (m.jobs || []).length); setConn("ok"); }
      const seen = new Set((m.jobs || []).map((x) => x.id));
      for (const id of [...jobs.keys()]) if (!seen.has(id)) { jobs.delete(id); speeds.delete(id); segPrev.delete(id); jobHist.delete(id); }
      for (const j of m.jobs || []) apply(j);
      // opened late (e.g. auto-launched by a browser offer): highlight the newest running job
      if (selected == null || !jobs.has(selected)) {
        const r = [...jobs.values()].filter((j) => j.status === "running").sort((a, b) => b.id - a.id)[0];
        if (r) { selected = r.id; renderRows(); }
      }
      break;
    case "accepted": apply({ id: m.id, status: "running", done: 0 }); selected = m.id; consumeQueueAssign(m.id); renderRows(); break;
    case "confirm":
      apply({ id: m.id, filename: m.filename, out_path: m.out_path, status: "confirming", done: 0 });
      selected = m.id;
      consumeQueueAssign(m.id);
      renderRows();
      openConfirm(m);
      break;
    case "show": focusWindow(); break;
    case "show-job":
      // background offer: the Rust side opens the compact detail popup; the
      // main window just tracks the selection quietly (never raise/focus)
      apply({ id: m.id });
      if (!detailWin) { selected = m.id; renderRows(); }
      break;
    case "tray-select": if (jobs.has(m.id)) { selected = m.id; renderRows(); } break;
    case "formats": if (window.__onFormats) window.__onFormats(m); break;
    case "error": if (window.__onFormats) { const f = window.__onFormats; window.__onFormats = null; f({ __err: m.error }); } else toast(trErr(m.error || "daemon error")); break;
    case "started": {
      const patch = { id: m.id, size: m.size };
      if (m.filename) { patch.filename = m.filename; patch.out_path = m.out_path; }
      apply(patch);
      consumeQueueAssign(m.id);
      if (m.filename) renderRows();
      break;
    }
    case "status": apply({ id: m.id, status: m.status, attempt: m.attempt, attempts: m.max }); renderRows(); break;
    case "job":
      apply({ id: m.id, queue: m.queue, priority: m.priority, speed_limit: m.speed_limit });
      break;
    case "progress": apply({ id: m.id, done: m.done, size: m.size, status: "running" }); break;
    case "detail":

    case "done": apply({ id: m.id, done: m.size, size: m.size, status: "completed", sha256: m.sha256, verified: m.verified }); notifyDone(jobs.get(m.id)); break;
    case "failed": apply({ id: m.id, status: "failed", error: m.error }); notifyFail(jobs.get(m.id), m.error); break;
    case "paused": apply({ id: m.id, status: "paused" }); break;
    case "cancelled": apply({ id: m.id, status: "cancelled" }); break;
    case "deleted": jobs.delete(m.id); speeds.delete(m.id); segPrev.delete(m.id); jobHist.delete(m.id); if (selected === m.id) selected = null;

setInterval(() => {
  const now = performance.now();
  for (const j of jobs.values()) {
    if (j.status === "running") {
      j.speed = sampleSpeed(j.id, j.done);
      let h = jobHist.get(j.id);
      if (!h) { h = []; jobHist.set(j.id, h); }
      // per-segment speed from consecutive detail snapshots (~400 ms cadence),
      // EMA-smoothed so the stacked bands do not strobe; the smoothed sum is
      // also what the card + graph label show, so both read the same number
      let seg = null;
      if (j.size && j.segs && j.segs.length && j.segs.length <= 32) {
        const cur = j.segs.map((s) => s.done);
        const p = segPrev.get(j.id);
        const dt = p ? (now - p.t) / 1000 : 0;
        if (p && dt >= 0.2) {
          seg = cur.map((d, i) => {
            const inst = Math.max(0, (d - (p.arr[i] ?? 0)) / dt);
            const prev = p.ema ? (p.ema[i] ?? null) : null;
            return prev == null ? inst : prev * 0.45 + inst * 0.55;
          });
        }
        segPrev.set(j.id, { t: now, arr: cur, ema: seg });
      }
      h.push({ v: seg ? seg.reduce((a, b) => a + b, 0) : (j.speed || 0), seg });
      if (h.length > 120) h.shift();
    } else if (segPrev.has(j.id)) {
      segPrev.delete(j.id);
    }
  }
  renderRows();
}, 500);

const YT_HOSTS = /(^|\.)(youtube\.com|youtu\.be|vimeo\.com|dailymotion\.com|twitch\.tv|instagram\.com|tiktok\.com|twitter\.com|x\.com|facebook\.com|fb\.watch|reddit\.com|soundcloud\.com|bilibili\.com|nicovideo\.jp|rumble\.com|odysee\.com)$/i;
function isPageUrl(u) {
  try {
    const x = new URL(u);
    if (YT_HOSTS.test(x.hostname)) return true;
    return !/\.[a-z0-9]{2,5}$/i.test(x.pathname);

    if (m.gallery) {

      openModal(`<h3>${t("dlg_quality_title")}</h3>

    const opts = heights.map((h) => {
      const f = fmts.find((x) => x.height === h);

    hint(t("hint_detecting"));
    window.__onFormats = (m) => {
      window.__onFormats = null;
      if (!m || m.__err) { hint(t("hint_fail", { e: (m && m.__err) || "?" })); return; }
      renderQuality(m);
    };
    try { await invoke("probe_url", { url }); } catch (e) { hint(t("hint_fail", { e: e })); }
  };
  $("m-detect").onclick = detect;

  const go = async () => {
    const url = $("m-url").value.trim();

    if (isPageUrl(url) && !$("m-quality").innerHTML) { return detect(); }
    try { await invoke("add_url", { url }); } catch (e) { toast(trErr(e)); }
    closeModal();
  };
  $("m-ok").onclick = go;
  $("m-url").addEventListener("keydown", (e) => e.key === "Enter" && go());
  setTimeout(() => $("m-url").focus(), 50);
};

    $("o-dns-grp").classList.toggle("custom", custom);
    if (custom) $("o-dns-custom").focus();
  };
  $("ft-all").onchange = () => {
    const on = $("ft-all").checked;
    $("ft-box").classList.toggle("all", on);
    for (const [id] of FTYPES) $("ft-" + id).disabled = on;
  };
  $("o-int").oninput = () => {
    if ($("o-int").value.trim() && $("ft-all").checked) {
      $("ft-all").checked = false;
      $("ft-all").onchange();
    }
  };
  $("o-ok").onclick = async () => {
    const next = $("o-lang").value;
    let ints = [];
    if (!$("ft-all").checked)
      for (const [id, , str] of FTYPES) if ($("ft-" + id).checked) ints.push(...str.split(" "));
    ints.push(...(($("o-int").value || "")
      .split(/[,;\s]+/)
      .map((x) => x.replace(/^\./, "").toLowerCase())
      .filter((x) => /^[a-z0-9]{1,8}$/.test(x))));
    ints = [...new Set(ints)];
    if (!$("ft-all").checked && ints.length === 0) toast(t("ft_empty_all"));
    const auto = $("o-auto").checked;
    // drop overrides the user added but left empty
    const catsClean = Object.fromEntries(Object.entries(catdirs).filter(([, v]) => v));
    await invoke("set_settings", {
      // keep keys this dialog does not edit (unknown/future settings)
      v: { ...s, dir: $("o-dir").value.trim() || null, segments: Number($("o-seg").value) || 8,
           max_parallel: Math.min(16, Math.max(1, Number($("o-par").value) || 3)),
           speed_limit: Math.max(0, Number($("o-speed").value) || 0),
           dns_mode: $("o-dns").value, dns_custom: $("o-dns-custom").value.trim(),
           categories: catsClean, ytdlp_update: $("o-ytdlp").checked, theme: $("o-theme").value,
            sha256: $("o-sha").checked,
           lang: next, intercept_ext: ints, autostart: auto, notify: $("o-notify").checked,
           clipboard_watch: $("o-clip").checked },
    });
    clipWatch = $("o-clip").checked;
    setTheme($("o-theme").value);
    await invoke("set_autostart", { enabled: auto }).catch((e) => toast(trErr(e)));
    closeModal();
    if (next !== lang) setLang(next);
  };
};

(async () => {
  try {
    const s = await invoke("get_settings");
    if (s && s.lang === "id") lang = "id";
    if (s && s.theme) setTheme(s.theme);
    clipWatch = !s || s.clipboard_watch !== false;
    // keep the autostart entry pointing at this build
    if (s && s.autostart) invoke("set_autostart", { enabled: true }).catch(() => {});
  } catch (e) { diag("lang load: " + e); }
  applyI18n();
})();

invoke("list_jobs").catch(() => {});
setInterval(() => invoke("list_jobs").catch(() => {}), 5000);
if (detailWin) initDetailWindow();

/* ---------- clipboard watch: offer to download copied links ---------- */
const clipSeen = new Set();
let clipLast = "";
let clipWatch = true;
function clipOffer(url) {
  clipSeen.add(url);
  let el = $("clipoff");
  if (!el) {
    el = document.createElement("div");
    el.id = "clipoff"; el.setAttribute("role", "dialog");
    el.innerHTML = `<div class="co-txt"></div><div class="co-btns">
      <button class="co-dl"></button><button class="co-x">✕</button></div>`;
    document.body.appendChild(el);
    el.querySelector(".co-x").onclick = () => el.classList.remove("on");
  }
  el.querySelector(".co-txt").textContent = url;
  el.title = url;
  const dl = el.querySelector(".co-dl");
  dl.textContent = t("btn_download");
  dl.onclick = () => {
    el.classList.remove("on");
    invoke("add_url", { url }).catch((e) => toast(trErr(e)));
  };
  el.classList.add("on");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("on"), 10000);
}
async function clipTick() {
  if (!clipWatch || detailWin || document.hidden) return;
  let txt = "";
  try { txt = (await invoke("plugin:clipboard-manager|read_text") || "").trim(); }
  catch { return; }
  if (!/^https?:\/\/\S+$/i.test(txt) || txt === clipLast) return;
  clipLast = txt;
  if (clipSeen.has(txt)) return;
  if ([...jobs.values()].some((j) => j.url === txt)) { clipSeen.add(txt); return; }
  clipOffer(txt);
}
setInterval(clipTick, 1000);

</script>
