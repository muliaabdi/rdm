[workspace]
resolver = "2"
members = ["crates/rdm-core", "crates/rdm-cli", "crates/rdm-daemon", "crates/rdm-host", "crates/rdm-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
tower = "0.5"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
rusqlite = { version = "0.32", features = ["bundled"] }
